<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script>
      (function() {
        const target = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + "/main.html";

        function launch() {
          const newTab = window.open("about:blank", "_blank");
          if (newTab) {
            const doc = newTab.document;
            doc.write(`
              <html>
                <head>
                  <title>Home</title>
                  <link rel="icon" href="https://ilmrx.github.io/illumoid/favicon.ico">
                  <style>
                    body, html { margin: 0; padding: 0; background: black; overflow: hidden; }
                    iframe { width: 100vw; height: 100vh; border: none; display: block; }
                  </style>
                </head>
                <body>
                  <iframe src="${target}" allow="fullscreen; clipboard-write; picture-in-picture"></iframe>
                </body>
              </html>
            `);
            doc.close();
            window.location.replace("https://classroom.google.com");
          }
        }

        if (document.readyState === 'complete') {
          launch();
        } else {
          window.addEventListener('load', launch);
        }
      })();
    </script>
  </head>
  <body style="background:black;"></body>
</html>
