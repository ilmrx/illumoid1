<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fight</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Orbitron,monospace}
    html,body{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d1117}
    canvas{width:100vw;height:100vh;display:block;background:transparent}
    #cinemaTop,#cinemaBottom{position:fixed;left:0;right:0;height:0;background:rgba(0,0,0,.96);pointer-events:none;z-index:100;transition:height 420ms}
    #cinemaTop{top:0}#cinemaBottom{bottom:0}
    .keypad{position:fixed;bottom:18px;z-index:220;width:360px;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none}
    .kp-left{left:18px;right:auto}
    .kp-right{right:18px;left:auto}
    .kb{display:grid;grid-template-columns:40px 40px 40px;grid-template-rows:28px 28px 28px;gap:8px;padding:10px;background:rgba(0,0,0,.12);border-radius:10px;border:1px solid rgba(0,238,255,.06);box-shadow:inset 0 -3px 8px rgba(0,0,0,.12)}
    .kb .kp-title{grid-column:1/-1;margin-bottom:4px;font-size:13px;font-weight:900;color:#eaf9ff;text-shadow:0 0 8px rgba(0,238,255,.16)}
    .k{width:40px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;color:#cfeeff;background:rgba(255,255,255,.03);transition:all 90ms;box-shadow:0 4px 8px rgba(0,0,0,.35)}
    .k.on{background:linear-gradient(180deg,#00eefd,#00a8c0);color:#001217;transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,168,192,.14)}
    .k.small{font-size:12px;height:24px;width:36px;border-radius:5px}
    .percentBox{min-width:190px;padding:12px 14px;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(255,255,255,.02));border:1px solid rgba(0,238,255,.06);display:flex;flex-direction:column;gap:6px;color:#bfefff;text-shadow:0 0 6px rgba(0,238,255,.06);position:relative;transition:transform 160ms ease, box-shadow 160ms ease}
    .percentBox:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .percentBig{font-size:36px;font-weight:700;letter-spacing:1px;color:#fff;transition:color 160ms,transform 140ms, text-shadow 160ms ease}
    .livesSmall{font-size:14px;color:#88f3ff}
    .percentBox.right{align-items:flex-end;text-align:right}
    .abilityTimer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:8px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(255,255,255,.02));border:1px solid rgba(0,238,255,.06);position:relative;transition:transform 160ms ease, box-shadow 160ms ease}
    .abilityTimer:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .abilityKey{font-size:16px;font-weight:900;color:#fff;text-shadow:0 0 6px rgba(0,238,255,.06)}
    .abilityCircle{width:40px;height:40px}
    .abilityTimer.right{order:-1}
    #__errOverlay{position:fixed;left:12px;right:12px;top:12px;padding:10px;background:rgba(0,0,0,.85);color:#fdd;font-family:monospace;font-size:13px;z-index:99999;white-space:pre-wrap;border-radius:8px;display:none}
    #gameOverModal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:120;pointer-events:none;opacity:0;transition:opacity 220ms ease}
    #gameOverModal.show{pointer-events:auto;opacity:1}
    .gom-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);z-index:0;pointer-events:auto}
    .gom-card{position:relative;min-width:360px;max-width:86vw;padding:28px;border-radius:12px;background:linear-gradient(180deg,#071827,#021118);border:1px solid rgba(0,238,255,.08);box-shadow:0 12px 60px rgba(0,0,0,.6);color:#eaf9ff;text-align:center;z-index:1;pointer-events:auto;transform:scale(.9);opacity:.9;transition:transform 220ms ease, opacity 220ms ease}
    #gameOverModal.show .gom-card{transform:scale(1);opacity:1}
    .gom-title{font-size:28px;font-weight:900;margin-bottom:12px;color:#fff;text-shadow:0 6px 30px rgba(0,238,255,.04)}
    .btn{padding:10px 18px;border-radius:8px;background:linear-gradient(180deg,#00eefd,#00a8c0);color:#001217;font-weight:700;border:none;cursor:pointer;box-shadow:0 10px 30px rgba(0,168,192,.08);transition:background 220ms ease, color 180ms ease, transform 120ms ease, box-shadow 160ms ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 14px 40px rgba(0,168,192,.12)}
    .btn.ready:hover{transform:none;box-shadow:0 10px 30px rgba(0,168,192,.08)}
    .btn.pulse:not([disabled]){animation:pulseGlow 1.4s ease-in-out infinite}
    @keyframes pulseGlow{0%,100%{box-shadow:0 10px 30px rgba(0,168,192,.10), 0 0 0 0 rgba(0,238,255,.0)}50%{box-shadow:0 18px 50px rgba(0,168,192,.22), 0 0 0 6px rgba(0,238,255,.12)}}
    .btn:focus{outline:2px solid rgba(255,255,255,.06);outline-offset:2px}
    .cheatBadge{position:fixed;left:0;right:0;margin:0 auto;top:18px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,0.6);color:#ffd;z-index:500;pointer-events:none;font-weight:700;letter-spacing:0.6px;display:none;transform:none}
    #mainMenu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300}
    #p1InfoBox,#p2InfoBox{position:fixed;top:0;bottom:0;margin:auto 0;transform:none;z-index:301;}
    #p1InfoBox{right: calc(50% + (min(520px, 90vw) / 2) + 24px);}
    #p2InfoBox{left:  calc(50% + (min(520px, 90vw) / 2) + 24px);}
    #p1InfoBox, #p2InfoBox{width: 260px;height: fit-content;}
    @media (max-width: 1000px){
      #p1InfoBox,#p2InfoBox{display:none}
    }
    .mm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.66);backdrop-filter:blur(2px)}
    .mm-card{position:relative;width:520px;max-width:90vw;padding:26px 22px;border-radius:14px;background:linear-gradient(180deg,#071827,#041017);border:1px solid rgba(0,238,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6);color:#eaf9ff;z-index:1;opacity:0;transform:translateY(10px) scale(.98);animation:mmEnter 300ms ease forwards}
    @keyframes mmEnter{to{opacity:1;transform:translateY(0) scale(1)}}
    .mm-title{font-size:28px;font-weight:900;text-align:center;margin-bottom:8px}
    .mm-sub{font-size:13px;color:#9fd9ff;text-align:center;margin-bottom:18px}
    .mm-row{display:flex;gap:12px;margin-bottom:12px}
    .mm-col{flex:1;background:rgba(255,255,255,0.02);border:1px solid rgba(0,238,255,0.06);border-radius:10px;padding:12px}
    .mm-col h3{font-size:16px;margin-bottom:10px}
    .mm-field{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
    .mm-field label{font-size:13px;color:#bfefff}
    select.mm-select{background:rgba(0,0,0,0.3);color:#eaf9ff;border:1px solid rgba(0,238,255,0.2);padding:8px 10px;border-radius:8px;font-weight:700;outline:none;min-width:120px;transition:box-shadow 120ms ease}
    select.mm-select:focus{box-shadow:0 0 0 2px rgba(0,238,255,0.35) inset}
    select.mm-select:hover{border-color:rgba(0,238,255,0.35)}
    .mm-actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
    .btn.secondary{background:rgba(0,0,0,0.4);color:#dff;border:1px solid rgba(0,238,255,0.14)}
    .btn.ready{background:linear-gradient(180deg,#00eefd,#00a8c0); color:#001217; box-shadow:0 10px 30px rgba(0,168,192,.08)}
    .btn.ready:hover{box-shadow:0 14px 40px rgba(0,168,192,.12)}
    .ready-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3}
    .ready-overlay.show{opacity:1}
    .ready-overlay .checkmark{font-size:48px;color:white}
    .char-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;width:100%;position:relative}
    .char-card{user-select:none;-webkit-user-select:none;display:block;aspect-ratio:1/1;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);cursor:pointer;transition:transform 140ms ease, box-shadow 140ms ease}
    .char-card:hover,.char-card:focus{outline:none;transform:scale(1.04);box-shadow:0 10px 30px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.5) inset}
    .char-card.active{box-shadow:0 0 0 2px rgba(255,255,255,0.9) inset, 0 0 18px rgba(255,255,255,0.25)}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .char-info{font-size:12px;color:#bfefff;margin-top:8px;min-height:36px;opacity:0;transform:translateY(4px);transition:opacity 180ms ease, transform 180ms ease; text-align:center}
    .char-info.show{opacity:1;transform:translateY(0)}
    .mm-settings{overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);transition:max-height 220ms ease, opacity 160ms ease, transform 160ms ease;display:grid;grid-auto-flow:column;gap:14px;align-items:flex-end}
    .mm-settings.open{max-height:140px;opacity:1;transform:translateY(0)}
    input.mm-input{background:rgba(0,0,0,0.3);color:#eaf9ff;border:1px solid rgba(0,238,255,0.2);padding:8px 10px;border-radius:8px;font-weight:700;outline:none;transition:box-shadow 120ms ease, transform 120ms ease}
    input.mm-input:focus{box-shadow:0 0 0 2px rgba(0,238,255,0.35) inset}
    .mm-settingsRow{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
    .mm-actionsWrap{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
    .visuallyHidden{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
    .dd{position:relative;display:inline-block}
    .dd-btn{padding:8px 34px 8px 12px;border-radius:8px;border:1px solid rgba(0,238,255,0.2);background:rgba(0,0,0,0.3);color:#eaf9ff;cursor:pointer;font-weight:700;min-width:140px;text-align:left;position:relative}
    .dd-btn:after{content:'';position:absolute;right:10px;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(191,239,255,0.9);transform:translateY(-25%);}
    .dd-btn:focus{outline:none;box-shadow:0 0 0 2px rgba(0,238,255,0.35) inset}
    .dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:linear-gradient(180deg,#071827,#041017);border:1px solid rgba(0,238,255,0.14);box-shadow:0 14px 44px rgba(0,0,0,0.55);border-radius:10px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity 140ms ease, transform 140ms ease;z-index:5;overflow:hidden}
    .dd.open .dd-menu{opacity:1;transform:translateY(0);pointer-events:auto}
    .dd-item{padding:10px 12px;color:#bfefff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06)}
    .dd-item:last-child{border-bottom:none}
    .dd-item:hover,.dd-item[aria-selected='true']{background:rgba(255,255,255,0.06);color:#eaf9ff}
    .dd-label{font-size:13px}
    .dd-kbd{font-size:11px;color:#9fd9ff;opacity:.8}
    .char-name{display:block;font-size:14px;font-weight:900;color:#eaf9ff;margin-bottom:2px}
    .char-desc{display:block;font-size:12px;color:#9fd9ff;opacity:.95}
    .infoRow{display:flex;gap:10px;align-items:flex-start}
    .infoRow .char-grid{flex:1}
    .char-infoBox{width:260px;padding:10px 12px;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(255,255,255,.02));border:1px solid rgba(0,238,255,.06);box-shadow:inset 0 -3px 8px rgba(0,0,0,.12)}
    .infoRow.right{flex-direction:row-reverse}
    .char-info{text-align:left}
    .statBars{margin-top:8px;display:grid;gap:6px}
    .statRow{display:flex;align-items:center;gap:8px}
    .statLabel{width:90px;font-size:11px;color:#bfefff}
    .statBar{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;border:1px solid rgba(0,238,255,0.06)}
    .statFill{height:100%;background:linear-gradient(90deg,#00eefd,#00a8c0)}
    .segBar{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:8px}
    .seg{background:rgba(255,255,255,0.06);border:1px solid rgba(200,240,255,0.18);border-radius:2px;opacity:0;transform:scaleY(0.6);transition:opacity 180ms ease, transform 200ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease}
    .seg.on{background:linear-gradient(180deg,#00eefd,#00a8c0);border-color:rgba(0,238,255,0.7);box-shadow:0 0 0 1px rgba(0,238,255,0.25) inset;opacity:1;transform:scaleY(1)}
  </style>
</head>
<body>
  <div id="__errOverlay" role="alert"></div>
  <div id="gameOverModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="gom-backdrop"></div>
    <div class="gom-card" role="document" aria-labelledby="gomTitle">
      <div id="gomTitle" class="gom-title"></div>
      <div class="gom-actions">
        <button id="gomRetry" class="btn">Retry</button>
      </div>
    </div>
  </div>
  <div class="keypad kp-left" aria-hidden="true">
    <div class="kb" id="leftKeys">
      <div class="kp-title" id="leftTitle">Default</div>
      <div class="k" id="L-none-a" style="visibility:hidden"></div>
      <div class="k" id="L-up">W</div>
      <div class="k" id="L-none-b" style="visibility:hidden"></div>
      <div class="k" id="L-left">A</div>
      <div class="k" id="L-down">S</div>
      <div class="k" id="L-right">D</div>
      <div class="k small" id="L-attack">C</div>
      <div class="k small" id="L-smash">V</div>
    </div>
    <div class="percentBox" id="leftPercentBox">
      <div class="percentBig" id="leftPercent">0%</div>
      <div class="livesSmall" id="leftLives">Lives: 3</div>
    </div>
    <div class="abilityTimer" id="leftAbilityTimer">
      <div class="abilityKey">B</div>
      <svg class="abilityCircle" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none"/>
        <circle cx="20" cy="20" r="18" stroke="#ff5578" stroke-width="4" fill="none" stroke-dasharray="113" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
      </svg>
    </div>
  </div>
  <div class="keypad kp-right" aria-hidden="true" style="right: 18px">
    <div class="abilityTimer right" id="rightAbilityTimer">
      <div class="abilityKey">;</div>
      <svg class="abilityCircle" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none"/>
        <circle cx="20" cy="20" r="18" stroke="#00aaff" stroke-width="4" fill="none" stroke-dasharray="113" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
      </svg>
    </div>
    <div class="percentBox right" id="rightPercentBox">
      <div class="percentBig" id="rightPercent">0%</div>
      <div class="livesSmall" id="rightLives">Lives: 3</div>
    </div>
    <div class="kb" id="rightKeys" style="margin-left:10px">
      <div class="kp-title" id="rightTitle">Default</div>
      <div class="k" id="R-none-a" style="visibility:hidden"></div>
      <div class="k" id="R-up">↑</div>
      <div class="k" id="R-none-b" style="visibility:hidden"></div>
      <div class="k" id="R-left">←</div>
      <div class="k" id="R-down">↓</div>
      <div class="k" id="R-right">→</div>
      <div class="k small" id="R-attack">K</div>
      <div class="k small" id="R-smash">L</div>
    </div>
  </div>
  <div id="mainMenu" aria-hidden="false" role="dialog" aria-modal="true">
    <div class="mm-backdrop"></div>
    <div class="mm-card" role="document">
      <div class="mm-title">Fight</div>
      <div class="mm-row">
        <div class="mm-col">
          <h3>P1 (Red)</h3>
          <div class="mm-field">
            <label for="p1Type">Control</label>
            <select id="p1Type" class="mm-select">
              <option value="human" selected>Human</option>
              <option value="ai">Bot</option>
            </select>
          </div>
          <div class="mm-field" id="p1DiffField">
            <label for="p1Diff">Difficulty</label>
            <input id="p1Diff" type="range" min="1" max="5" step="1" value="3" aria-label="P1 Difficulty" />
          </div>
          <h3>Characters</h3>
          <div class="mm-field infoRow" style="align-items:flex-start;gap:10px">
            <div id="p1Chars" class="char-grid" role="listbox" aria-label="P1 Character Select">
              <div id="p1ReadyOverlay" class="ready-overlay"><div class="checkmark"></div></div>
            </div>
          </div>
          <div class="mm-actions" style="justify-content:flex-end; gap:8px">
            <button id="p1Ready" class="btn secondary" data-ready="false">Ready</button>
            <button id="p1Random" class="btn secondary" type="button">Random</button>
          </div>
        </div>
        <div class="mm-col">
          <h3>P2 (Blue)</h3>
          <div class="mm-field">
            <label for="p2Type">Control</label>
            <select id="p2Type" class="mm-select">
              <option value="human" selected>Human</option>
              <option value="ai">Bot</option>
            </select>
          </div>
          <div class="mm-field" id="p2DiffField">
            <label for="p2Diff">Difficulty</label>
            <input id="p2Diff" type="range" min="1" max="5" step="1" value="3" aria-label="P2 Difficulty" />
          </div>
          <h3>Characters</h3>
          <div class="mm-field infoRow right" style="align-items:flex-start;gap:10px">
            <div id="p2Chars" class="char-grid" role="listbox" aria-label="P2 Character Select">
              <div id="p2ReadyOverlay" class="ready-overlay"><div class="checkmark"></div></div>
            </div>
          </div>
          <div class="mm-actions" style="justify-content:flex-end; gap:8px">
            <button id="p2Ready" class="btn secondary" data-ready="false">Ready</button>
            <button id="p2Random" class="btn secondary" type="button">Random</button>
          </div>
        </div>
      </div>
      <div class="mm-actions mm-actionsWrap">
        <button id="mmStart" class="btn" disabled>Start Match</button>
        <button id="mmSettingsBtn" class="btn secondary" type="button" aria-expanded="false" aria-controls="mmSettings">Settings</button>
      </div>
      <div class="mm-settingsRow">
        <div id="mmSettings" class="mm-settings" aria-hidden="true">
          <div class="mm-field">
            <label for="mmLives">Lives</label>
            <input id="mmLives" class="mm-input" type="number" min="1" max="100" step="1" value="3" style="width:80px" />
          </div>
          <div class="mm-field">
            <label for="mmDmg">Damage x</label>
            <input id="mmDmg" class="mm-input" type="number" min="0.1" max="100" step="0.1" value="1" style="width:80px" />
          </div>
          <div class="mm-field">
            <label for="mmKb">Knockback x</label>
            <input id="mmKb" class="mm-input" type="number" min="0.5" max="100" step="0.1" value="1" style="width:80px" />
          </div>
        </div>
      </div>
    </div>
    <div class="char-infoBox" id="p1InfoBox"><div id="p1CharInfo" class="char-info" aria-live="polite"></div></div>
    <div class="char-infoBox" id="p2InfoBox"><div id="p2CharInfo" class="char-info" aria-live="polite"></div></div>
  </div>
  <canvas id="c"></canvas>
  <div id="cinemaTop"></div>
  <div id="cinemaBottom"></div>
  <div id="cheatBadge" class="cheatBadge"></div>
  <div id="easterEgg" style="display: none; position: fixed; inset: 0; z-index: 9999;">
    <img src="/image/dispatch/ayo sus.png" style="width: 100%; height: 100%; object-fit: contain;" />
  </div>
  <script>
const BASE_W=1600, BASE_H=900, DT=1/100, GRAV=0.375, SIZE=44, MAX_PERCENT=500, KNOCK_SCALE=3.5;
const ATTACKS = {
  light:{size:{w:128,h:56},timing:{wind:1,active:1,recovery:1},base:5,knock:2,vscale:0.6,stun:30,horizCap:60},
  smash:{size:{w:56,h:30},timing:{wind:4,active:6,recovery:7},base:20,knock:30,vscale:0.3,stun:40,horizCap:9999}
};
const SETTINGS = {
  lives: 3,
  damage: 1,
  knockback: 1,
};
const CHARACTERS = {
  default:     { speedMul:1.00, damageMul:1.00, cooldowns:{light:68,  smash:165}, abilityCooldown:3000 },
  brute:       { speedMul:0.75, damageMul:1.00, cooldowns:{light:82, smash:180}, abilityCooldown:4000 },
  bandit:      { speedMul:1.50, damageMul:0.80, cooldowns:{light:120, smash:270} },
  bomb:        { speedMul:1.00, damageMul:1.00, cooldowns:{light:90, smash:210}, abilityCooldown:1000 },
  juggernaut:  { speedMul:0.70, damageMul:1.00, cooldowns:{light:90, smash:210}, abilityCooldown:8000 },
  mage:        { speedMul:1.00, damageMul:1.00, cooldowns:{light:90, smash:225}, abilityCooldown:2000 },
  vampire:     { speedMul:1.10, damageMul:0.95, cooldowns:{light:82, smash:195}, abilityCooldown:5000 },

      blank.className = 'char-card'; blank.style.opacity = '0.2'; blank.style.pointerEvents='none';
      gridEl.appendChild(blank);
    }
  }
  const state = { p1:{ sel:'default', ready:false }, p2:{ sel:'default', ready:false } };
  function highlight(side, id){  markActive(side, id); }
  function markActive(side, id){ const grid = side==='p1'?p1Chars:p2Chars; [...grid.children].forEach(ch=> ch.classList.toggle('active', ch.dataset.char===id)); }
  function setInfo(side, c, animate){
    const box = side==='p1'?document.getElementById('p1CharInfo'):document.getElementById('p2CharInfo');
    if(!box) return;
    if(c){
      const cfg = CHARACTERS[c.id] || CHARACTERS.default;
      const clamp01 = (v)=>Math.max(0,Math.min(1,v));
      const speedScore = clamp01((cfg.speedMul||1)/1.65);
      const dmgScore = clamp01((cfg.damageMul||1)/1.5);
      const avgDefault = (CHARACTERS.default.cooldowns.light + CHARACTERS.default.cooldowns.smash)/2;
      const avgCd = (cfg.cooldowns.light + cfg.cooldowns.smash)/2;
      const cdScore = clamp01(avgDefault/avgCd);
      const defMap = {juggernaut:0.9, brute:0.65, frost:0.6, vampire:0.55, brawler:0.55, default:0.5, bomb:0.5, mage:0.5, thunder:0.5, berserker:0.5};
      const makeSegBar = (score)=>{ const filled = Math.round(clamp01(score)*10); const cells = Array.from({length:10},()=>`<div class=\"seg\"></div>`).join(''); return `<div class=\"segBar\" data-filled=\"${filled}\">${cells}</div>`; };
      const row = (label,score)=>`<div class=\"statRow\"><div class=\"statLabel\">${label}</div>${makeSegBar(score)}</div>`;
      const slowRow = c.id==='frost' ? row('Slow', 0.4) : '';
      const statsHtml = `<div class=\"statBars\">${row('Defense',defMap[c.id] ?? 0.5)}${row('Speed',speedScore)}${row('Damage',dmgScore)}${row('Cooldown',cdScore)}${slowRow}</div>`;
      box.innerHTML = `<span class='char-name'>${c.name}</span><span class='char-desc'>${c.sub}</span>${statsHtml}`;
      const segBars = box.querySelectorAll('.segBar');
      segBars.forEach(bar=>{
        const filled = parseInt(bar.getAttribute('data-filled')||'0',10);
        const cells = Array.from(bar.children);
        cells.forEach((cell,i)=>{ cell.classList.remove('on'); setTimeout(()=>{ if(i < filled) cell.classList.add('on'); }, i*60); });
      });
      if(animate!==false){ box.classList.remove('show'); requestAnimationFrame(()=>{ box.classList.add('show'); }); }
    } else {
      box.classList.remove('show'); box.textContent='';
    }
  }
  function select(side, id){ state[side].sel = id; markActive(side, id); const c = CHAR_LIST.find(x=>x.id===id); setInfo(side, c, true); }
  function pickRandomCharId(){ const ids = CHAR_LIST.map(c=>c.id); return ids[Math.floor(Math.random()*ids.length)]; }
  function randomize(side){ const id = pickRandomCharId(); select(side, id); }
  function updateStartEnabled(){ const ok = state.p1.ready && state.p2.ready; if(startBtn){ startBtn.disabled = !ok; } }
  function toggleReady(side, btn){
    state[side].ready = !state[side].ready;
    btn.dataset.ready = String(state[side].ready);
    btn.setAttribute('aria-pressed', state[side].ready ? 'true' : 'false');
    btn.classList.toggle('secondary', !state[side].ready);
    btn.classList.toggle('ready', !!state[side].ready);
    btn.textContent = 'Ready';
    updateStartEnabled();
    const overlay = document.getElementById(side + 'ReadyOverlay');
    if(overlay) {
      if(state[side].ready){
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }
    const randomBtn = document.getElementById(side + 'Random');
    if(randomBtn) randomBtn.disabled = state[side].ready;
  }
  if(p1Chars) fillGrid(p1Chars,'p1'); if(p2Chars) fillGrid(p2Chars,'p2');
  if(p1ReadyBtn) p1ReadyBtn.addEventListener('click', () => toggleReady('p1', p1ReadyBtn));
  if(p2ReadyBtn) p2ReadyBtn.addEventListener('click', () => toggleReady('p2', p2ReadyBtn));
  const p1RandomBtn = document.getElementById('p1Random');
  const p2RandomBtn = document.getElementById('p2Random');
  if(p1RandomBtn) p1RandomBtn.addEventListener('click', ()=> randomize('p1'));
  if(p2RandomBtn) p2RandomBtn.addEventListener('click', ()=> randomize('p2'));
  if(p1Sel) p1Sel.addEventListener('change', ()=>{ applyDiffVisibility(); applyReadyVisibility(); });
  if(p2Sel) p2Sel.addEventListener('change', ()=>{ applyDiffVisibility(); applyReadyVisibility(); });
  applyDiffVisibility(); applyReadyVisibility();
  const p1RandomBtn2 = document.getElementById('p1Random'); if(p1RandomBtn2) p1RandomBtn2.style.display = '';
  const p2RandomBtn2 = document.getElementById('p2Random'); if(p2RandomBtn2) p2RandomBtn2.style.display = '';
  if(startBtn){ startBtn.addEventListener('click', ()=>startMatchFromMenu(state.p1.sel, state.p2.sel)); }
  markActive('p1', state.p1.sel); markActive('p2', state.p2.sel);
  mm.style.display='flex';
  inMainMenu = true;
})();
const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
            performanceMode = document.documentElement.classList.contains('performance-mode');
        }
    });
});
observer.observe(document.documentElement, { attributes: true });
requestAnimationFrame(step);
window._camera = camera; window._fighters = fighters; window._resetMatch = resetMatch; window._AI_ENABLED = AI_ENABLED; window._start = startMatchFromMenu;
  function applyBombExplosion(bomber, target, strength){
    const spec = ATTACKS.smash;
    const params = { base: 0, knock: spec.knock, stun: spec.stun, vscale: spec.vscale, horizontalBias: 1.8 };
    const addDmg = (strength||1) < 1 ? 50 : 150;
    target.percent = clamp(target.percent + addDmg, 0, MAX_PERCENT);
    const baseKb = params.knock * (1 + (target.percent * KNOCK_SCALE) / 100);
    const kb = (bomber.knockHuge ? baseKb * 5 : baseKb) * (strength||1);
    const maxHorizontal = spec.horizCap; const horizontal = clamp(kb * 0.12 * (params.horizontalBias || 1), 0.6, maxHorizontal);
    const vertical = kb * (params.vscale || 1) * 0.05 + Math.min(18, target.percent * 0.03);
    const sign = target.center().x > bomber.center().x ? 1 : -1;
    const dirX = sign; const dirY = 0;
    target.vx = dirX * horizontal + (bomber.vx||0) * 0.12;
    target.vy = -Math.abs(vertical) - Math.random()*1.8;
    target.hitstun = clamp((params.stun || 12) * (1 + target.percent / 260), 6, 140);
    target.controlsLocked = true; target.flash = 12; bomber.invul = 8;
    target.hitPauseUntil = now() + 120;
    setTimeout(()=>{ if(now() >= target.hitPauseUntil) { target.hitPauseUntil = 0; target.controlsLocked = false; } }, 160);
    const color = '#ffd966';
    spawnExplosion(target.center().x, target.center().y, color, 1.6, {glow:true,big:true});
    spawnWind(target.center().x, target.center().y, sign, -0.1, color, 1.2, 520);
    SharedAudio.sfx(120,0.5,'triangle',0.28);
    SharedAudio.sfx(260,0.2,'sine',0.2);
  }
  </script>
