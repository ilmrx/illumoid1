<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Dash Clone Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <style>
      @font-face {
        font-family: "Pusab";
        src: url("/styles/pusab.ttf") format("truetype");
      }
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        /* Ensure body and html take full height for modals to center */
        height: 100%;
      }
      canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: center;
      }
      #startMenu {
        background-color: rgba(
          0,
          0,
          0,
          0.7
        ); /* Add a background to make it opaque */
        color: white; /* Text color */
        display: flex; /* Make it visible and center content */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: "Pusab";
        z-index: 10; /* Bring it to the front */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #deathScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
      }
      #startMenu h1,
      #deathScreen h1,
      #winScreen h1 {
        font-size: 3em;
        margin-bottom: 20px;
      }
      #startMenu button,
      #deathScreen button,
      #winScreen button {
        font-size: 1.5em;
        padding: 10px 20px;
        border: 2px solid white;
        background-color: transparent;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
      }
      #startMenu button:hover,
      #deathScreen button:hover,
      #winScreen button:hover {
        background-color: white;
        color: black;
      }
      #deathScreen,
      #winScreen {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: "Pusab", sans-serif;
        z-index: 10;
      }
      #progressContainer {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 5;
      }
      #progressBar {
        width: 350px;
        max-width: 80vw;
        height: 12px;
        background-color: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
        border: 2px solid white;
        overflow: hidden;
      }
      #progressText {
        color: white;
        font-family: "Pusab";
        font-size: 14px;
      }
      #progressBarFill {
        height: 100%;
        background: #0f0;
        width: 0%;
        border-radius: 6px;
        border-top-right-radius: 0px;
        border-bottom-right-radius: 0px;
        transition: width 0.2s ease-out;
      }
      #editor-palette {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.5);
        border: 1px solid white;
        border-radius: 10px;
        padding: 5px;
        display: flex;
        gap: 5px;
        z-index: 20;
      }
      .palette-item {
        width: 40px;
        height: 40px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .palette-item.selected {
        border-color: #0f0;
      }
      .palette-item.delete {
        background-color: #ff4d4d;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>');
      }
      .palette-item.rotate {
        background-color: #4d94ff;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>');
      }
    </style>
  </head>
  <body>
    <div id="background"></div>
    <div id="ground"></div>
    <div id="startMenu">
      <h1>unfinished geometry dash clone</h1>
      <button id="challengeBtn">Challenge</button>
      <button id="stereoBtn">Stereo Madness</button>
    </div>
    <div id="deathScreen" style="display: none">
      <h1>Game Over</h1>
      <p>Attempts: <span id="attemptCounter">1</span></p>
      <button id="retryBtn">Retry</button>
    </div>
    <div id="winScreen" style="display: none">
      <h1>You Win!</h1>
      <button id="playAgainBtn">Play Again</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <canvas id="uiCanvas" style="position: absolute; top: 50%; left: 50%; transform-origin: center; pointer-events: none;"></canvas>
    <div id="progressContainer">
      <div id="progressBar"><div id="progressBarFill"></div></div>
      <span id="progressText">0%</span>
    </div>
    <div id="editor-palette" style="display: none;"></div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const uiCanvas = document.getElementById("uiCanvas");
      const ctx = uiCanvas.getContext("2d");
      const bgMusic = new Audio('https://files.catbox.moe/nqj2ou.mp3');
      bgMusic.loop = true;
      const deathSound = new Audio('https://files.catbox.moe/ub1vza.mp3');
      const jumpSound = { play: function () {}, currentTime: 0 };
      const app = new PIXI.Application({ view: canvas, width: 1920, height: 1080, backgroundAlpha: 0, antialias: false, resolution: 1 });
      const cameraContainer = new PIXI.Container();
      app.stage.addChild(cameraContainer);
      let staticContainer = new PIXI.Container();
      let dynamicContainer = new PIXI.Container();
      let levelSprites = new Map();
      let playerSprite = null;
      let lastProgress = -1;
      let currentLevel;
      cameraContainer.addChild(staticContainer);
      cameraContainer.addChild(dynamicContainer);
      const ASSET_CONFIG = {
        // ... (asset configuration remains the same)
        player_cube: "/image/gd/player_cube.png",
        player_ship: "/image/gd/player_ship.png",
        player_ball: "/image/gd/player_ball.png",
        player_ufo: "/image/gd/player_ufo.png",
        player_wave: "/image/gd/player_wave.png",
        spike1: "/image/gd/obstacle_spike.png",
        halfspike1: "/image/gd/obstacle_spike.png", // Reuse spike image
        block1: "/image/gd/obstacle_block.png",
        halfblock1: "/image/gd/obstacle_block.png", // Reuse block image for half blocks
        orb_yellow: "/image/gd/orb_yellow.png",
        portal_cube: "/image/gd/portal_cube.png",
        portal_ship: "/image/gd/portal_ship.png",
        portal_ball: "/image/gd/portal_ball.png",
        portal_ufo: "/image/gd/portal_ufo.png",
        portal_wave: "/image/gd/portal_wave.png",
        portal_speed_slow: "/image/gd/portal_speed_slow.png",
        portal_speed_normal: "/image/gd/portal_speed_normal.png",
        portal_speed_fast: "/image/gd/portal_speed_fast.png",
        portal_speed_faster: "/image/gd/portal_speed_faster.png",
        portal_speed_fastest: "/image/gd/portal_speed_fastest.png",
        color_trigger: "/image/gd/portal_cube.png", // Reuse cube portal image
        background: "/image/gd/background.png",
        ground: "/image/gd/ground.png",
      };
      const assets = {};
      const imgs = {};


      // --- Core Constants ---
      // Values are derived from community analysis of the game at 240Hz, then scaled to 60Hz.
      // Velocity values are divided by 4 (240/60).
      // Acceleration values are divided by 16 ( (240/60)^2 ).
      const CONSTANTS = {
        PIXELS_PER_UNIT: 30,
        GROUND_HEIGHT_UNITS: 4,
        TIMESTEP: 1 / 60,
        // Camera offset (position) and zoom (scale)
        CAMERA_ZOOM: 3.3, // Actual zoom scale (1.0 = normal, 1.5 = 50% closer)
        CAMERA_OFFSET: 0, // Player position offset
        CAMERA_POSITION_X: 150, // Additional right offset
        SHOW_HITBOXES: false, // Toggle for hitbox visualization
        LEVEL_END: 280,
        PHYSICS: {
          CUBE: {
            GRAVITY: 90, // Increased for proper 2-block jump height
            JUMP_VEL: 22, // Increased for proper jump height
            ROTATION_SPEED: 540, // Degrees per second in air
            // Hitbox dimensions (smaller than visual for accurate collision)
            HITBOX_WIDTH: 0.5,
            HITBOX_HEIGHT: 0.5,
            LANDING_HITBOX_WIDTH: 0.8, // Larger for easier platform landing
            LANDING_HITBOX_HEIGHT: 0.8,
            DANGER_HITBOX_WIDTH: 0.4, // Smaller for spike precision
            DANGER_HITBOX_HEIGHT: 0.4,
          },
          SHIP: {
            // Ship uses acceleration, not direct velocity changes
            UP_ACCEL: 45, // Slightly reduced for smoother ascent
            DOWN_ACCEL_HELD: -30, // Increased
            DOWN_ACCEL_RELEASED: 30, // Further reduced for smoother descent
            MAX_VEL: 12, // Increased
            MIN_VEL: -11, // Increased
            TILT_FACTOR: 3.5,
            HITBOX_WIDTH: 0.6,
            HITBOX_HEIGHT: 0.4,
            LANDING_HITBOX_WIDTH: 0.7,
            LANDING_HITBOX_HEIGHT: 0.5,
            DANGER_HITBOX_WIDTH: 0.5,
            DANGER_HITBOX_HEIGHT: 0.3,
          },
          BALL: {
            GRAVITY: 65, // Increased
            FLIP_VEL_BOOST: 0.3, // Increased
            ROTATION_SPEED: 360, // Degrees per second
            HITBOX_WIDTH: 0.6,
            HITBOX_HEIGHT: 0.6,
            LANDING_HITBOX_WIDTH: 0.7,
            LANDING_HITBOX_HEIGHT: 0.7,
            DANGER_HITBOX_WIDTH: 0.5,
            DANGER_HITBOX_HEIGHT: 0.5,
          },
          UFO: {
            GRAVITY: 50, // Increased
            JUMP_VEL: 12, // Increased
            HITBOX_WIDTH: 0.75,
            HITBOX_HEIGHT: 0.75,
            LANDING_HITBOX_WIDTH: 0.8,
            LANDING_HITBOX_HEIGHT: 0.8,
            DANGER_HITBOX_WIDTH: 0.6,
            DANGER_HITBOX_HEIGHT: 0.6,
          },
          WAVE: {
            // Wave movement is not gravity-based, it's a fixed velocity angle
            VELOCITY: 10.4, // Matches normal speed
            HITBOX_WIDTH: 0.1,
            HITBOX_HEIGHT: 0.1,
            LANDING_HITBOX_WIDTH: 0.1,
            LANDING_HITBOX_HEIGHT: 0.1,
            DANGER_HITBOX_WIDTH: 0.1,
            DANGER_HITBOX_HEIGHT: 0.1,
          },
        },
        SPEEDS: {
          // In units per second
          SLOW: 8.37,
          NORMAL: 10.38,
          FAST: 12.9,
          FASTER: 15.5,
          FASTEST: 19.2,
        },
        // Object hitboxes based on Geometry Dash community research
        OBJECT_HITBOXES: {
          spike1: { x: 0.425, y: 0.1, width: 0.16, height: 0.5 }, // Centered on spike
          halfspike1: { x: 0.4, y: 0, width: 0.2, height: 0.25 }, // Half height spike
          block1: { x: 0, y: 0, width: 1.0, height: 1.0 }, // Smaller for side death only
          halfblock1: { x: 0, y: 0, width: 1.0, height: 0.5 }, // Half height block
          orb_yellow: { x: 0, y: 0, width: 1, height: 1 },
          portal_cube: { x: 0, y: 0, width: 0.8, height: 2 }, // 2 blocks tall
          portal_ship: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_ball: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_ufo: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_wave: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_speed_slow: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_speed_normal: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_speed_fast: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_speed_faster: { x: 0, y: 0, width: 0.8, height: 2 },
          portal_speed_fastest: { x: 0, y: 0, width: 0.8, height: 2 },
          color_trigger: { x: 0, y: 0, width: 0.8, height: 2 },
        },
      };

      // --- Game State ---
      let gameState = {};
      let keys = {};
      let attempts = 1;
      let lastColorOffset = 0;
      let lastGroundColorOffset = 0;
      let lastBackgroundColorOffset = 0;
      let groundCanvas = null;
      let groundSprite = null;
      let backgroundCanvas = null;
      let backgroundSprite = null;

      function resetGameState() {
        levelSprites.clear();
        staticContainer.removeChildren();
        if (groundSprite) staticContainer.addChild(groundSprite);
        gameState = {
          player: {
            x: 5, // position in units
            y: 2, // position in units
            vx: CONSTANTS.SPEEDS.NORMAL, // velocity in units/sec
            vy: 0, // velocity in units/sec
            rotation: 0, // degrees
            targetRotation: 45, // degrees
            flashTime: 0, // seconds
            onGround: true,
            gravity: CONSTANTS.PHYSICS.CUBE.GRAVITY,
          },
          camera: {
            x: 0, // position in pixels
            y: 2 * CONSTANTS.PIXELS_PER_UNIT - 1080 * 0.77, // Start at ground lock position to avoid initial camera movement
          },
          gameMode: "cube",
          isInputDown: false,
          jumpBuffer: null,
          particles: [], // Player particle effects
          orbBuffer: null,
          waveTrail: [], // For wave mode trail effect
          visualEffects: [],
          colorOffset: 0,
          level: currentLevel ? currentLevel.objects : [],
          levelEnd: currentLevel ? currentLevel.levelEnd : 280,
          status: "menu", // menu, playing, dead, win
        };
      }


      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? [
            parseInt(result[1], 16) / 255,
            parseInt(result[2], 16) / 255,
            parseInt(result[3], 16) / 255,
            1.0
        ] : [0, 0, 0, 1];
      }

      function interpolateColor(color1, color2, t) {
        const r1 = parseInt(color1.slice(1,3),16);
        const g1 = parseInt(color1.slice(3,5),16);
        const b1 = parseInt(color1.slice(5,7),16);
        const r2 = parseInt(color2.slice(1,3),16);
        const g2 = parseInt(color2.slice(3,5),16);
        const b2 = parseInt(color2.slice(5,7),16);
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        return `rgb(${r},${g},${b})`;
      }


      // --- Asset & Canvas Setup ---
      function resizeCanvas() {
        const baseWidth = 1920;
        const baseHeight = 1080;
        const scaleX = 1; // No scaling needed for width
        const scaleY = window.innerHeight / baseHeight;
        const scale = Math.min(scaleY, 1);
        canvas.width = baseWidth;
        canvas.height = baseHeight;
        canvas.style.width = baseWidth + 'px';
        canvas.style.height = baseHeight + 'px';
        canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
        canvas.style.backgroundImage = `url(${ASSET_CONFIG.background})`;
        canvas.style.backgroundSize = '60%';
        canvas.style.backgroundRepeat = 'repeat-x';
        uiCanvas.width = baseWidth;
        uiCanvas.height = baseHeight;
        uiCanvas.style.width = baseWidth + 'px';
        uiCanvas.style.height = baseHeight + 'px';
        uiCanvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      function loadAssets(callback) {
        const imgPromises = Object.keys(ASSET_CONFIG).map(key => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.src = ASSET_CONFIG[key];
            img.onload = () => {
              imgs[key] = img;
              assets[key] = PIXI.Texture.from(img);
              resolve();
            };
            img.onerror = () => {
              console.error(`Failed to load img: ${key}`);
              resolve();
            };
          });
        });
        Promise.all(imgPromises).then(() => {
          callback();
        });
      }

      // --- Input Handling ---
      function handleInputDown(e) {
        if (
          e.repeat &&
          gameState.gameMode !== "ship" &&
          gameState.gameMode !== "wave"
        )
          return;
        if (gameState.status !== "playing") return;

        if (!editorMode) {
          gameState.isInputDown = true;
          if (gameState.jumpBuffer) clearTimeout(gameState.jumpBuffer);
          gameState.jumpBuffer = setTimeout(
            () => (gameState.jumpBuffer = null),
            100
          ); // 100ms jump buffer
          gameState.orbBuffer = setTimeout(
            () => (gameState.orbBuffer = null),
            100
          ); // 100ms orb buffer


          // Mode-specific immediate actions
          if (gameState.gameMode === "ball" && gameState.player.onGround) {
            gameState.player.gravity *= -1;
            gameState.player.vy +=
              gameState.player.gravity > 0
                ? -CONSTANTS.PHYSICS.BALL.FLIP_VEL_BOOST
                : CONSTANTS.PHYSICS.BALL.FLIP_VEL_BOOST;
          }
          if (gameState.gameMode === "ufo") {
            // UFO can jump mid-air with each click
            gameState.player.vy = CONSTANTS.PHYSICS.UFO.JUMP_VEL;
          }
          if (gameState.gameMode === "cube" && gameState.player.onGround) {
            jumpSound.currentTime = 0;
            jumpSound.play();
          }
        }
      }
      function handleKeyDown(e) {
        if (e.key === "h" || e.key === "H") {
            CONSTANTS.SHOW_HITBOXES = !CONSTANTS.SHOW_HITBOXES;
        }
        if (editorMode) {
            keys[e.key] = true;
            return;
        }
        if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            handleInputDown(e);
        }
        keys[e.key] = true;
      }

      function handleKeyUp(e) {
        if (!editorMode) handleInputUp();
        keys[e.key] = false;
      }
      function handleInputUp() {
        if (!editorMode) {
          gameState.isInputDown = false;
        }
      }

      function handleMouseDown(e) {
        if (editorMode) {
          if (e.shiftKey && e.button === 0) {
            // Start drag select
            const rect = canvas.getBoundingClientRect();
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
            const unscaledX = (e.clientX - rect.left) / scale;
            const unscaledY = (e.clientY - rect.top) / scale;
            selectStart = { x: unscaledX, y: unscaledY };
            selecting = true;
          } else {
            handleEditorClick(e);
          }
        } else {
          handleInputDown(e);
        }
      }

      function handleMouseMove(e) {
        if (editorMode && selecting) {
          const rect = canvas.getBoundingClientRect();
          const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
          const unscaledX = (e.clientX - rect.left) / scale;
          const unscaledY = (e.clientY - rect.top) / scale;
          selectEnd = { x: unscaledX, y: unscaledY };
        }
      }

      function handleMouseUp(e) {
        if (editorMode && selecting) {
          selecting = false;
          if (selectStart && selectEnd) {
            // Calculate selection
            const minX = Math.min(selectStart.x, selectEnd.x);
            const maxX = Math.max(selectStart.x, selectEnd.x);
            const minY = Math.min(selectStart.y, selectEnd.y);
            const maxY = Math.max(selectStart.y, selectEnd.y);
            // Convert to world
            const worldMinX = (minX - canvas.width/2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.x;
            const worldMaxX = (maxX - canvas.width/2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.x;
            const worldMinY = - (maxY - canvas.height/2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.y;
            const worldMaxY = - (minY - canvas.height/2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.y;
            selectedObjects = editorLevel.filter(obj => {
              const objX = obj.x * CONSTANTS.PIXELS_PER_UNIT;
              const objY = obj.y * CONSTANTS.PIXELS_PER_UNIT;
              return objX >= worldMinX && objX <= worldMaxX && objY >= worldMinY && objY <= worldMaxY;
            });
          }
          selectStart = null;
          selectEnd = null;
        }
      }

      // --- Game Loop ---
      let lastTime = 0;
      let accumulator = 0;

      function gameLoop(currentTime) {
        const deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        if (gameState.status === "playing") {
          if (editorMode) {
              gameState.status = "editor";
              return;
          }
          accumulator += deltaTime;

          // Prevent spiral of death
          if (accumulator > 0.1) { // Max 100ms of catch-up
            accumulator = 0.1;
          }

          updateEffects(deltaTime);

          while (accumulator >= CONSTANTS.TIMESTEP) {
            update(CONSTANTS.TIMESTEP);
            accumulator -= CONSTANTS.TIMESTEP;
          }
        } else if (gameState.status === "editor") {
          const cameraSpeed = 600; // pixels per second
      
          if (keys['w'] || keys['ArrowUp']) gameState.camera.y -= cameraSpeed * deltaTime;
          if (keys['s'] || keys['ArrowDown']) gameState.camera.y += cameraSpeed * deltaTime;
          if (keys['a'] || keys['ArrowLeft']) gameState.camera.x -= cameraSpeed * deltaTime;
          if (keys['d'] || keys['ArrowRight']) gameState.camera.x += cameraSpeed * deltaTime;
      
          gameState.level = [...editorLevel];
          render();
        } else {
          updateEffects(deltaTime); // Keep effects running on death/win screens
          lastTime = currentTime;
        }

        render();
        requestAnimationFrame(gameLoop);
      }

      // --- Particle System ---
      function updateParticles(dt) {
        // Add particles when player is on the ground and not in wave mode
        if (gameState.player.onGround && gameState.gameMode !== "wave" && Math.random() < 0.3) {
          gameState.particles.push({
            x: gameState.player.x + 0.1,
            y: gameState.player.y + 0.1,
            vx: -3 - Math.random() * 2, // Slower backwards
            vy: Math.random() * 2 + 0.5, // Slower up
            life: 0.5, // Slightly longer life
            size: Math.random() * 3 + 2, // Slightly bigger
            shape: "square",
          });
        }

        // Update existing particles
        gameState.particles = gameState.particles.filter((particle) => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          // Only apply gravity to non-death particles (like the player trail)
          if (particle.type !== 'death') {
            particle.vy -= 20 * dt;
          }
          particle.life -= dt * 2.0;
          return particle.life > 0;
        });
      }

      // --- Physics & State Update ---
      function update(dt) {
        const { player, gameMode, isInputDown } = gameState;
        const phys = CONSTANTS.PHYSICS;

        // Handle mode-specific logic
        switch (gameMode) {
          case "cube":
            player.gravity = phys.CUBE.GRAVITY;
            if (gameState.jumpBuffer && player.onGround) {
              player.vy = phys.CUBE.JUMP_VEL;
              gameState.jumpBuffer = null;
            }
            // Add support for holding down the jump button for the cube
            if (isInputDown && player.onGround) {
              player.vy = phys.CUBE.JUMP_VEL;
              jumpSound.currentTime = 0;
              jumpSound.play(); // Optional: uncomment to play sound on every auto-jump
            }
            if (!player.onGround) {
              player.rotation += phys.CUBE.ROTATION_SPEED * dt;
            }
            break;
          case "ship":
            // Ship has no fixed gravity, but acceleration
            const accel = isInputDown
              ? phys.SHIP.UP_ACCEL
              : -phys.SHIP.DOWN_ACCEL_RELEASED;
            player.vy += accel * dt;
            // Clamp velocity
            if (player.vy > phys.SHIP.MAX_VEL) player.vy = phys.SHIP.MAX_VEL;
            if (player.vy < phys.SHIP.MIN_VEL) player.vy = phys.SHIP.MIN_VEL;

            player.y += player.vy * dt;
            player.rotation = -player.vy * phys.SHIP.TILT_FACTOR;
            break;
          case "ball":
            // Gravity is flipped on input, not set here
            // Ball rotates continuously, faster when on ground
            const ballRotationSpeed = player.onGround
              ? phys.BALL.ROTATION_SPEED * 2
              : phys.BALL.ROTATION_SPEED;
            player.rotation +=
              ballRotationSpeed * (player.gravity > 0 ? 1 : -1) * dt;
            break;
          case "ufo":
            player.gravity = phys.UFO.GRAVITY;
            // Jump impulse is handled in handleInputDown
            break;
          case "wave":
            player.gravity = 0;
            player.vy = isInputDown ? player.vx : -player.vx;
            const ceilingY = canvas.height / CONSTANTS.PIXELS_PER_UNIT - 1;
            if (player.y <= 2 || player.y >= ceilingY) {
              player.targetRotation = 0;
              player.rotation = 0; // Instant on ground/ceiling
            } else {
              player.targetRotation = isInputDown ? -45 : 45;
            }
            // Update wave trail with timestamp
            gameState.waveTrail.push({
              x: player.x,
              y: player.y,
              rotation: player.targetRotation,
              timestamp: performance.now(),
            });
            // Limit trail length and remove old trails (4 seconds)
            const currentTime = performance.now();
            gameState.waveTrail = gameState.waveTrail.filter(
              (trail) => currentTime - trail.timestamp < 4000
            );
            break;
        }

        // Smooth rotation towards target for wave mode
        if (gameState.gameMode === "wave") {
          const rotationSpeed = 720; // degrees per second, faster
          const diff = player.targetRotation - player.rotation;
          const shortestDiff = ((diff + 180) % 360) - 180;
          player.rotation += Math.sign(shortestDiff) * Math.min(Math.abs(shortestDiff), rotationSpeed * dt);
        }

        // Apply gravity & Update position (except for ship which does its own)
        if (gameMode !== "ship") {
          player.vy -= player.gravity * dt;
          player.y += player.vy * dt;
        }
        player.x += player.vx * dt;

        // --- Check Color Triggers ---
        let triggersToRemove = [];
        gameState.level.forEach((obj) => {
          if (obj.type === "color_trigger" && player.x >= obj.x) {
            gameState.colorOffset += 1;
            triggersToRemove.push(obj);
          }
        });
        gameState.level = gameState.level.filter(obj => !triggersToRemove.includes(obj));

        // --- Win Condition ---
        if (player.x >= gameState.levelEnd) {
          handleWin();
        }

        // --- Collision Detection ---
        handleCollisions();
      }

      function updateEffects(dt) {
        // --- Update Particles ---
        updateParticles(dt);

        // --- Update Player Flash ---
        if (gameState.player.flashTime > 0) {
          gameState.player.flashTime -= dt;
        }

        // --- Update Visual Effects ---
        gameState.visualEffects.forEach((effect, index) => {
            effect.life -= dt * 60; // Assuming 60fps logic
            if (effect.life <= 0) {
                gameState.visualEffects.splice(index, 1);
            } else if (effect.type === 'respawn_circle') {
                effect.x = gameState.player.x + (effect.offsetX || 0);
                effect.y = gameState.player.y + 0.5; // Center on player
            }
        });
      }

      function checkCollision(player, obj, hitboxWidth, hitboxHeight) {
        const objHitbox = CONSTANTS.OBJECT_HITBOXES[obj.type];
        if (!objHitbox) return false;

        if (obj.rotation) {
          const objCenterX = obj.x + objHitbox.x + objHitbox.width / 2;
          const objCenterY = obj.y + objHitbox.y + objHitbox.height / 2;
          const playerCenterX = player.x + hitboxWidth / 2;
          const playerCenterY = player.y + hitboxHeight / 2;
          const relX = playerCenterX - objCenterX;
          const relY = playerCenterY - objCenterY;
          const rotationRad = -obj.rotation * Math.PI / 180;
          const cos = Math.cos(rotationRad);
          const sin = Math.sin(rotationRad);
          const rotatedRelX = relX * cos - relY * sin;
          const rotatedRelY = relX * sin + relY * cos;
          const playerMinX = rotatedRelX - hitboxWidth / 2;
          const playerMaxX = rotatedRelX + hitboxWidth / 2;
          const playerMinY = rotatedRelY - hitboxHeight / 2;
          const playerMaxY = rotatedRelY + hitboxHeight / 2;
          const objMinX = -objHitbox.width / 2;
          const objMaxX = objHitbox.width / 2;
          const objMinY = -objHitbox.height / 2;
          const objMaxY = objHitbox.height / 2;
          return playerMaxX > objMinX && playerMinX < objMaxX && playerMaxY > objMinY && playerMinY < objMaxY;
        } else {
          const collisionX = player.x + hitboxWidth > obj.x + objHitbox.x && player.x < obj.x + objHitbox.x + objHitbox.width;
          const collisionY = player.y + hitboxHeight > obj.y + objHitbox.y && player.y < obj.y + objHitbox.y + objHitbox.height;
          return collisionX && collisionY;
        }
      }

      function handleCollisions() {
        const { player } = gameState;
        const groundY = 2;
        const phys = CONSTANTS.PHYSICS[gameState.gameMode.toUpperCase()];

        // Get accurate hitbox dimensions for current game mode
        const hitboxWidth = phys.HITBOX_WIDTH || 0.8;
        const hitboxHeight = phys.HITBOX_HEIGHT || 0.8;
        const landingHitboxWidth = phys.LANDING_HITBOX_WIDTH || hitboxWidth;
        const landingHitboxHeight = phys.LANDING_HITBOX_HEIGHT || hitboxHeight;
        const dangerHitboxWidth = phys.DANGER_HITBOX_WIDTH || hitboxWidth;
        const dangerHitboxHeight = phys.DANGER_HITBOX_HEIGHT || hitboxHeight;

        // Ground collision (use landing hitbox for safe landing)
        if (player.y <= groundY && player.gravity >= 0) {
          // Use >= to catch ball mode correctly
          player.y = groundY;
          player.vy = 0;
          if (!player.onGround) {
            player.onGround = true;
            if (
              gameState.gameMode === "cube" ||
              gameState.gameMode === "ball"
            ) {
              player.rotation = Math.round(player.rotation / 90) * 90;
            }
          }
        } else if (player.y > groundY && player.gravity > 0) {
          player.onGround = false;
        }

        // Ceiling collision (use landing hitbox for safe collision)
        const ceilingY = canvas.height / CONSTANTS.PIXELS_PER_UNIT - 1;
        if (player.y >= ceilingY) {
          player.y = ceilingY;
          if (player.vy > 0) player.vy = 0;
          // For ball on ceiling
          if (gameState.gameMode === "ball" && player.gravity < 0) {
            player.onGround = true;
            player.rotation = Math.round(player.rotation / 90) * 90;
          }
        }

        // Accurate collision with level objects using proper hitboxes, accounting for rotation
        gameState.level.forEach((obj) => {
          // Determine which hitbox to use
          let collisionHitboxWidth, collisionHitboxHeight;
          if (obj.type === "block1" || obj.type === "halfblock1") {
            collisionHitboxWidth = landingHitboxWidth;
            collisionHitboxHeight = landingHitboxHeight;
          } else if (obj.type === "spike1" || obj.type === "halfspike1") {
            collisionHitboxWidth = dangerHitboxWidth;
            collisionHitboxHeight = dangerHitboxHeight;
          } else {
            collisionHitboxWidth = hitboxWidth;
            collisionHitboxHeight = hitboxHeight;
          }

          if (checkCollision(player, obj, collisionHitboxWidth, collisionHitboxHeight)) {
            const objHitbox = CONSTANTS.OBJECT_HITBOXES[obj.type];
              if (obj.type.startsWith("portal_speed")) {
                const speedName = obj.type.split("_")[2].toUpperCase();
                if (CONSTANTS.SPEEDS[speedName]) {
                  player.vx = CONSTANTS.SPEEDS[speedName];
                }
              } else if (obj.type.startsWith("portal")) {
                const newMode = obj.type.split("_")[1];
                if (gameState.gameMode !== newMode) {
                  gameState.gameMode = newMode;
                  player.rotation = 0; // Reset rotation on mode change
                  // Reset gravity for ball mode
                  if (newMode === "ball") {
                    player.gravity = CONSTANTS.PHYSICS.BALL.GRAVITY;
                  }
                  // Set target rotation for wave mode
                  if (newMode === "wave") {
                    player.targetRotation = 45;
                  }
                }
              } else if (obj.type === "orb_yellow") {
                if (gameState.orbBuffer) {
                  player.vy = phys.JUMP_VEL;
                  gameState.visualEffects.push({ type: 'orb_flash', x: obj.x, y: obj.y, life: 20, maxLife: 20 });
                  gameState.orbBuffer = null;
                }
              } else if (obj.type === "block1" || obj.type === "halfblock1" || obj.type === "spike1" || obj.type === "halfspike1") {
                // Special handling for blocks to allow landing on top
                if (
                  obj.type === "block1" ||
                  obj.type === "obstacle_half_block"
                ) {
                  const blockTop = obj.y + objHitbox.y + objHitbox.height;
                  const blockBottom = obj.y + objHitbox.y;
                  const playerTop = player.y + hitboxHeight;
                  const playerBottom = player.y;

                  let isSafeCollision = false;

                  // Check for landing on top (all modes)
                  const prevPlayerBottom =
                    playerBottom - player.vy * CONSTANTS.TIMESTEP; // Estimate previous position
                  const landingTolerance = 0.3; // Allow player to be slightly inside the block
                  if (player.vy <= 0 && prevPlayerBottom >= blockTop - landingTolerance) {
                    player.y = blockTop;
                    player.vy = 0;
                    player.onGround = true;
                    if (
                      gameState.gameMode === "cube" ||
                      gameState.gameMode === "ball"
                    ) {
                      player.rotation = Math.round(player.rotation / 90) * 90;
                    }
                    isSafeCollision = true;
                  }

                  // Check for hitting from bottom (ship, ufo, ball) - underside landing
                  const prevPlayerTop =
                    playerTop - player.vy * CONSTANTS.TIMESTEP;
                  const undersideTolerance = 0.3; // Allow slight overlap for easier landing
                  if (
                    !isSafeCollision &&
                    ["ship", "ufo", "ball"].includes(gameState.gameMode) &&
                    player.vy > 0 &&
                    prevPlayerTop <= blockBottom + undersideTolerance
                  ) {
                    player.y = blockBottom - collisionHitboxHeight;
                    player.vy = 0;
                    isSafeCollision = true;
                    // For ball mode, hitting the ceiling should feel like being on the ground
                    if (gameState.gameMode === "ball") {
                      player.onGround = true; // Allows gravity flip
                      player.rotation = Math.round(player.rotation / 90) * 90;
                    }
                  }

                  // If no safe vertical collision was resolved, it's a fatal side collision.
                  if (!isSafeCollision) {
                    handleDeath();
                  }
                } else {
                  // Spikes kill on any contact
                  handleDeath();
                }
              }
          } else {
            // Fallback for objects without defined hitboxes
            if (
              player.x + hitboxWidth > obj.x &&
              player.x < obj.x + 0.8 &&
              player.y < obj.y + 0.8 &&
              player.y + hitboxHeight > obj.y
            ) {
              if (obj.type.startsWith("portal_speed")) {
                const speedName = obj.type.split("_")[2].toUpperCase();
                if (CONSTANTS.SPEEDS[speedName]) {
                  player.vx = CONSTANTS.SPEEDS[speedName];
                }
              } else if (obj.type.startsWith("portal")) {
                const newMode = obj.type.split("_")[1];
                if (gameState.gameMode !== newMode) {
                  gameState.gameMode = newMode;
                  player.rotation = 0;
                  if (newMode === "ball") {
                    player.gravity = CONSTANTS.PHYSICS.BALL.GRAVITY;
                  }
                }
              } else if (obj.type === "orb_yellow") {
                if (gameState.orbBuffer) {
                  player.vy = phys.JUMP_VEL;
                  gameState.orbBuffer = null;
                }
              } else if (obj.type === "block1" || obj.type === "halfblock1" || obj.type === "spike1" || obj.type === "halfspike1") {
                console.log("Collision detected! Resetting.");
                handleDeath();
              }
            }
          }
        });
      }

      function createDeathParticles() {
        const player = gameState.player;
        const phys = CONSTANTS.PHYSICS[gameState.gameMode.toUpperCase()];
        const playerCenterX = player.x + (phys.HITBOX_WIDTH || 1) / 2;
        const playerCenterY = player.y + (phys.HITBOX_HEIGHT || 1) / 2;

        // Add shockwave effect
        gameState.visualEffects.push({
            type: 'death_shockwave',
            x: playerCenterX,
            y: playerCenterY,
            life: 30,
            maxLife: 30
        });

        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * 2 * Math.PI;
          const speed = Math.random() * 4 + 1; // Slower explosion speed
          gameState.particles.push({
            x: playerCenterX,
            y: playerCenterY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.2,
            size: Math.random() * 4 + 2,
            type: "death", // Mark as a death particle
          });
        }
      }
      function handleWin() {
        gameState.status = "win";

        winScreen.style.display = "flex";
      }

      function handleOrbJump() {
        const { player } = gameState;
        const phys = CONSTANTS.PHYSICS[gameState.gameMode.toUpperCase()];
        const hitboxWidth = phys.HITBOX_WIDTH || 0.8;
        const hitboxHeight = phys.HITBOX_HEIGHT || 0.8;

        gameState.level.forEach((obj) => {
          if (obj.type === "orb_yellow") {
            const collisionX =
              player.x + hitboxWidth > obj.x && player.x < obj.x + 1;
            const collisionY =
              player.y + hitboxHeight > obj.y && player.y < obj.y + 1;

            if (collisionX && collisionY) {
              player.vy = phys.JUMP_VEL;
              jumpSound.currentTime = 0;
              // jumpSound.play();
            }
          }
        });
      }

      function handleDeath() {
        if (gameState.status === "dead") return; // Don't trigger death twice

        gameState.status = "dead";
        createDeathParticles();
        bgMusic.pause();
        deathSound.currentTime = 0;
        deathSound.play();

        setTimeout(() => {
          resetGameState();
          gameState.player.flashTime = 0.25;
          // Center respawn circles on player position
          const playerCenterX = gameState.player.x + 0.5;
          const playerCenterY = gameState.player.y + 0.5;
          gameState.visualEffects.push({ type: 'respawn_circle', x: playerCenterX, y: playerCenterY, life: 45, maxLife: 45 });
          setTimeout(() => {
            gameState.visualEffects.push({ type: 'respawn_circle', x: playerCenterX, y: playerCenterY, life: 45, maxLife: 45 });
          }, 100); // Second circle spawns 100ms later
          gameState.status = "playing";
          bgMusic.currentTime = 0;
          bgMusic.play();
        }, 500); // 0.5 second respawn delay
      }

      // --- Rendering ---
      function render() {
        const { player, camera } = gameState;
        const x_smoothing = 0.9; // Faster horizontal smoothing
        const y_smoothing = 0.05; // Much slower vertical smoothing for smoother camera

        if (!editorMode) {
            // --- Target Calculation ---
            // Use CAMERA_POSITION_X to define where the player should be on the screen horizontally
            // Adjust for full-width canvas
            const targetX =
              player.x * CONSTANTS.PIXELS_PER_UNIT - CONSTANTS.CAMERA_POSITION_X;
            let targetY;
            if (player.y > 2 + 4) { // 4 blocks above ground
              targetY = player.y * CONSTANTS.PIXELS_PER_UNIT - canvas.height * 0.77; // Lower locking by ~1 block
            } else {
              targetY = 2 * CONSTANTS.PIXELS_PER_UNIT - canvas.height * 0.77; // Lock at ground level
            }

            // --- Smoothing ---
            camera.x += (targetX - camera.x) * x_smoothing;
            camera.y += (targetY - camera.y) * y_smoothing;
        }

        // --- Clear UI Canvas ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);


        // Draw grid in editor
        if (editorMode) {
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1;
          const gridSize = 30 * CONSTANTS.CAMERA_ZOOM;
          let offsetX = (gameState.camera.x * CONSTANTS.CAMERA_ZOOM) % gridSize;
          if (offsetX < 0) offsetX += gridSize;
          let offsetY = (gameState.camera.y * CONSTANTS.CAMERA_ZOOM) % gridSize;
          if (offsetY < 0) offsetY += gridSize;
          offsetY += 0; // Shift grid down to align with block centers
          for (let x = -offsetX; x < canvas.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
          }
          for (let y = -offsetY; y < canvas.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
          }
        }

        // Draw selection box in editor
        if (editorMode && selecting && selectStart && selectEnd) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.strokeRect(selectStart.x, selectStart.y, selectEnd.x - selectStart.x, selectEnd.y - selectStart.y);
          ctx.setLineDash([]);
        }

        // --- Update Ground Sprite (only when changed) ---
        if (!groundSprite) {
          groundCanvas = document.createElement('canvas');
          const groundHeight = CONSTANTS.GROUND_HEIGHT_UNITS * CONSTANTS.PIXELS_PER_UNIT * 2;
          groundCanvas.width = 90; // Set ground image width to 90px
          groundCanvas.height = groundHeight;
          const groundCtx = groundCanvas.getContext('2d');
          groundCtx.filter = `hue-rotate(${gameState.colorOffset * 60}deg)`;
          groundCtx.drawImage(imgs.ground, 0, 0, 90, groundHeight);
          groundSprite = new PIXI.TilingSprite(PIXI.Texture.from(groundCanvas), canvas.width / CONSTANTS.CAMERA_ZOOM, CONSTANTS.GROUND_HEIGHT_UNITS * CONSTANTS.PIXELS_PER_UNIT * 2);
          groundSprite.tileScale.set(1);
          staticContainer.addChild(groundSprite);
          lastGroundColorOffset = gameState.colorOffset;
        }
        if (gameState.colorOffset !== lastGroundColorOffset) {
          const groundHeight = CONSTANTS.GROUND_HEIGHT_UNITS * CONSTANTS.PIXELS_PER_UNIT * 2;
          const groundCtx = groundCanvas.getContext('2d');
          groundCtx.clearRect(0, 0, groundCanvas.width, groundCanvas.height);
          groundCtx.filter = `hue-rotate(${gameState.colorOffset * 60}deg)`;
          groundCtx.drawImage(imgs.ground, 0, 0, 90, groundHeight);
          groundSprite.texture = PIXI.Texture.from(groundCanvas);
          lastGroundColorOffset = gameState.colorOffset;
        }

        // --- Update Background Hue (only when changed) ---
        if (!backgroundSprite) {
          backgroundCanvas = document.createElement('canvas');
          backgroundCanvas.width = imgs.background.width;
          backgroundCanvas.height = imgs.background.height;
          const bgCtx = backgroundCanvas.getContext('2d');
          bgCtx.filter = `hue-rotate(${gameState.colorOffset * 60}deg)`;
          bgCtx.drawImage(imgs.background, 0, 0);
          backgroundSprite = new PIXI.TilingSprite(PIXI.Texture.from(backgroundCanvas), canvas.width / CONSTANTS.CAMERA_ZOOM, canvas.height / CONSTANTS.CAMERA_ZOOM);
          staticContainer.addChildAt(backgroundSprite, 0);
          lastBackgroundColorOffset = gameState.colorOffset;
        }
        if (gameState.colorOffset !== lastBackgroundColorOffset) {
          const bgCtx = backgroundCanvas.getContext('2d');
          bgCtx.clearRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
          bgCtx.filter = `hue-rotate(${gameState.colorOffset * 60}deg)`;
          bgCtx.drawImage(imgs.background, 0, 0);
          backgroundSprite.texture = PIXI.Texture.from(backgroundCanvas);
          lastBackgroundColorOffset = gameState.colorOffset;
        }

        // --- Set Camera ---
        // Adjust camera positioning for full-width canvas
        cameraContainer.x = -camera.x * CONSTANTS.CAMERA_ZOOM;
        cameraContainer.y = camera.y * CONSTANTS.CAMERA_ZOOM;
        cameraContainer.scale.set(CONSTANTS.CAMERA_ZOOM);

        // --- Move Background Slower ---
        // Background parallax for full-width canvas
        canvas.style.backgroundPositionX = `${-camera.x * 0.2}px`;

        // --- Clear Previous Frame ---
        dynamicContainer.removeChildren();

        // --- Draw Ground ---
        const groundHeight =
          CONSTANTS.GROUND_HEIGHT_UNITS * CONSTANTS.PIXELS_PER_UNIT * 2;
        const groundDrawY =
          canvas.height - groundHeight + 6 * CONSTANTS.PIXELS_PER_UNIT;
        groundSprite.x = camera.x; // Move with camera to stay in view
        groundSprite.tilePosition.x = -camera.x * 1; // Scroll texture slower for parallax
        groundSprite.y = groundDrawY;

        // --- Draw Level Objects ---
        gameState.level.forEach((obj) => {
          if (obj.type === "color_trigger") return; // Invisible triggers
          let sprite = levelSprites.get(obj);
          if (!sprite) {
            const texture = assets[obj.type];
            if (texture) {
              sprite = new PIXI.Sprite(texture);
              sprite.anchor.set(0.5);
              staticContainer.addChild(sprite);
              levelSprites.set(obj, sprite);
            }
          }
          if (sprite) {
            const isPortal = obj.type.startsWith("portal");
            const widthMultiplier = isPortal ? 1.3 : 1.0;
            const heightMultiplier = isPortal ? 0.8 : 1.0;
            const baseHeight = isPortal ? 2
              : obj.type === "halfblock1"
              ? 0.5
              : obj.type === "halfspike1"
              ? 0.5
              : 1.0;
            const objHeight = baseHeight * CONSTANTS.PIXELS_PER_UNIT;
            const x = obj.x * CONSTANTS.PIXELS_PER_UNIT + (CONSTANTS.PIXELS_PER_UNIT * widthMultiplier) / 2;
            const y = canvas.height - obj.y * CONSTANTS.PIXELS_PER_UNIT - objHeight / 2;
            sprite.x = x;
            sprite.y = y;
            sprite.width = CONSTANTS.PIXELS_PER_UNIT * widthMultiplier;
            sprite.height = objHeight * heightMultiplier;
            sprite.rotation = (obj.rotation || 0) * Math.PI / 180;
            sprite.visible = editorMode || obj.x >= gameState.player.x - 7 && obj.x <= gameState.player.x + 20;
            // Highlight selected objects
            if (editorMode && selectedObjects.includes(obj)) {
              const highlight = new PIXI.Graphics();
              highlight.lineStyle(4, 0xffff00);
              highlight.drawRect(obj.x * CONSTANTS.PIXELS_PER_UNIT, canvas.height - obj.y * CONSTANTS.PIXELS_PER_UNIT - objHeight, CONSTANTS.PIXELS_PER_UNIT * widthMultiplier, objHeight * heightMultiplier);
              dynamicContainer.addChild(highlight);
            }
            // Draw object hitboxes if visualization is enabled
            if (CONSTANTS.SHOW_HITBOXES) {
              const objHitbox = CONSTANTS.OBJECT_HITBOXES[obj.type];
              if (objHitbox) {
                const hitboxX = (obj.x + objHitbox.x) * CONSTANTS.PIXELS_PER_UNIT;
                const hitboxY = canvas.height - (obj.y + objHitbox.y + objHitbox.height) * CONSTANTS.PIXELS_PER_UNIT;
                const hitboxWidth = objHitbox.width * CONSTANTS.PIXELS_PER_UNIT;
                const hitboxHeight = objHitbox.height * CONSTANTS.PIXELS_PER_UNIT;
                const hitbox = new PIXI.Graphics();
                hitbox.lineStyle(1.5, obj.type === "block1" || obj.type === "halfblock1" ? 0x0066ff : obj.type === "spike1" ? 0xff0000 : 0xffff00);
                hitbox.globalAlpha = 0.8;
                hitbox.drawRect(-hitboxWidth / 2, -hitboxHeight / 2, hitboxWidth, hitboxHeight);
                hitbox.x = hitboxX + hitboxWidth / 2;
                hitbox.y = hitboxY + hitboxHeight / 2;
                hitbox.rotation = (obj.rotation || 0) * Math.PI / 180;
                dynamicContainer.addChild(hitbox);
              }
            }
          }
        });

        // --- Draw Wave Trail ---
        if (gameState.gameMode === "wave" && gameState.waveTrail.length > 0) {
          gameState.waveTrail.forEach((trail, index) => {
            const x = trail.x * CONSTANTS.PIXELS_PER_UNIT;
            const y =
              canvas.height -
              trail.y * CONSTANTS.PIXELS_PER_UNIT -
              CONSTANTS.PIXELS_PER_UNIT;
            const trailSize = CONSTANTS.PIXELS_PER_UNIT * 0.4; // Adjusted for better overlap at high speeds

            const trailGraphics = new PIXI.Graphics();
            trailGraphics.beginFill(0xffffff);
            trailGraphics.drawRect(-trailSize / 2, -trailSize / 2, trailSize, trailSize);
            trailGraphics.endFill();
            trailGraphics.x = x + CONSTANTS.PIXELS_PER_UNIT / 2;
            trailGraphics.y = y + CONSTANTS.PIXELS_PER_UNIT / 2;
            trailGraphics.rotation = trail.rotation * Math.PI / 180;
            dynamicContainer.addChild(trailGraphics);
          });
        }

        // --- Draw Particles ---
        if (gameState.particles.length > 0) {
          gameState.particles.forEach((particle) => {
            const x = particle.x * CONSTANTS.PIXELS_PER_UNIT;
            const y = canvas.height - particle.y * CONSTANTS.PIXELS_PER_UNIT;

            const particleGraphics = new PIXI.Graphics();
            particleGraphics.globalAlpha = particle.life;
            particleGraphics.beginFill(0xffffff);
            if (particle.shape === "circle") {
              particleGraphics.drawCircle(x, y, particle.size);
            } else {
              particleGraphics.drawRect(
                x - particle.size / 2,
                y - particle.size / 2,
                particle.size,
                particle.size
              );
            }
            particleGraphics.endFill();
            dynamicContainer.addChild(particleGraphics);
          });
        }

        // --- Draw Visual Effects (Flashes, Shockwaves) ---
        gameState.visualEffects.forEach((effect) => {
            const effectX = effect.x * CONSTANTS.PIXELS_PER_UNIT;
            const effectY = canvas.height - effect.y * CONSTANTS.PIXELS_PER_UNIT;
            const lifeRatio = Math.max(0, effect.life / effect.maxLife);

            if (effect.type === 'orb_flash') {
                const radius = (1 - lifeRatio) * 50; // Expands outwards
                const effectGraphics = new PIXI.Graphics();
                effectGraphics.globalAlpha = lifeRatio;
                effectGraphics.lineStyle(4 * lifeRatio, effect.color || 0xffff00);
                effectGraphics.drawCircle(effectX, effectY, radius);
                dynamicContainer.addChild(effectGraphics);
            } else if (effect.type === 'portal_flash') {
                const texture = assets[effect.obj_type];
                if (texture) {
                    const widthMultiplier = 1.3;
                    const heightMultiplier = 0.8;
                    const portalHeight = 2 * CONSTANTS.PIXELS_PER_UNIT; // Portals are 2 blocks high
                    const sprite = new PIXI.Sprite(texture);
                    sprite.anchor.set(0.5);
                    sprite.x = effect.x * CONSTANTS.PIXELS_PER_UNIT + (CONSTANTS.PIXELS_PER_UNIT * widthMultiplier) / 2;
                    sprite.y = canvas.height - effect.y * CONSTANTS.PIXELS_PER_UNIT - (portalHeight * heightMultiplier) / 2;
                    sprite.width = CONSTANTS.PIXELS_PER_UNIT * widthMultiplier;
                    sprite.height = portalHeight * heightMultiplier;
                    // Add brightness filter for flash effect
                    const brightnessFilter = new PIXI.filters.ColorMatrixFilter();
                    brightnessFilter.brightness(1.5);
                    sprite.filters = [brightnessFilter];
                    dynamicContainer.addChild(sprite);
                }
            } else if (effect.type === 'death_shockwave') {
                const radius = (1 - lifeRatio) * 120; // Larger shockwave
                const grad = new PIXI.Graphics();
                grad.globalAlpha = lifeRatio;
                grad.beginFill(0xffffff, 0);
                grad.drawCircle(0, 0, radius * 0.5);
                grad.endFill();
                grad.beginFill(0xffffff, 0.5);
                grad.drawCircle(0, 0, radius);
                grad.endFill();
                grad.x = effectX;
                grad.y = effectY;
                dynamicContainer.addChild(grad);
            } else if (effect.type === 'respawn_circle') {
                const radius = (1 - lifeRatio) * 50; // Expands outwards
                const circleGraphics = new PIXI.Graphics();
                circleGraphics.globalAlpha = lifeRatio;
                circleGraphics.lineStyle(0.3, 0xffffff); // Thinner white outline, no fill
                circleGraphics.drawCircle(0, 0, radius);
                // Center circle on player position
                circleGraphics.x = effectX;
                circleGraphics.y = effectY;
                dynamicContainer.addChild(circleGraphics);
            }
        });

        // --- Draw Player ---
        if (gameState.status !== "dead" && !editorMode) {
          const playerTexture = assets[`player_${gameState.gameMode}`];
          if (playerTexture) {
            if (!playerSprite) {
              playerSprite = new PIXI.Sprite(playerTexture);
              playerSprite.anchor.set(0.5);
              playerSprite.width = 30;
              playerSprite.height = 30;
            } else if (playerSprite.texture !== playerTexture) {
              playerSprite.texture = playerTexture;
            }
            const x = player.x * CONSTANTS.PIXELS_PER_UNIT;
            const y = canvas.height - player.y * CONSTANTS.PIXELS_PER_UNIT - CONSTANTS.PIXELS_PER_UNIT;
            playerSprite.x = x + CONSTANTS.PIXELS_PER_UNIT / 2;
            playerSprite.y = y + CONSTANTS.PIXELS_PER_UNIT / 2;
            playerSprite.rotation = player.rotation * Math.PI / 180;
            if (player.flashTime > 0) playerSprite.alpha = 0.3; else playerSprite.alpha = 1;
            dynamicContainer.addChild(playerSprite);
            // Draw player hitbox if visualization is enabled
            if (CONSTANTS.SHOW_HITBOXES) {
              const phys = CONSTANTS.PHYSICS[gameState.gameMode.toUpperCase()];
              const hitboxWidth = phys.HITBOX_WIDTH * CONSTANTS.PIXELS_PER_UNIT;
              const hitboxHeight = phys.HITBOX_HEIGHT * CONSTANTS.PIXELS_PER_UNIT;
              const hitbox = new PIXI.Graphics();
              hitbox.lineStyle(1.5, 0x00ff00);
              hitbox.globalAlpha = 0.8;
              hitbox.drawRect(
                x + (CONSTANTS.PIXELS_PER_UNIT - hitboxWidth) / 2,
                y + (CONSTANTS.PIXELS_PER_UNIT - hitboxHeight) / 2,
                hitboxWidth,
                hitboxHeight
              );
              dynamicContainer.addChild(hitbox);
            }
          }
        }


        // --- Draw UI/Help Text ---
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px Arial";
        if (editorMode) {
          ctx.fillText("LEVEL EDITOR MODE", 10, 30);
          ctx.fillText(`Camera X: ${Math.round(gameState.camera.x)}, Y: ${Math.round(gameState.camera.y)}`, 10, 50);
          ctx.fillText(
            "Click: Place | Shift+Click: Select | Drag: Select Area | Ctrl+C: Copy | Ctrl+V: Paste | Del: Delete Selected",
            10,
            70
          );
          ctx.fillText(`Objects: ${editorLevel.length} | Selected: ${selectedObjects.length}`, 10, 90);
        } else if (gameState.status === "playing") {
          ctx.fillText(`Mode: ${gameState.gameMode.toUpperCase()}`, 10, 30);
          ctx.fillText(
            `Hitboxes: ${CONSTANTS.SHOW_HITBOXES ? "ON" : "OFF"} (Press H)`,
            10,
            50
          );
          ctx.fillText("Click/Space: Jump | Tab: Level Editor", 10, 70);
          ctx.fillText(`Position: X=${Math.round(player.x * 100) / 100}, Y=${Math.round(player.y * 100) / 100}`, 10, 90);
          // Update progress bar
          const progress = Math.min(
            (player.x / gameState.levelEnd) * 100,
            100
          );
          if (progress !== lastProgress) {
            document.getElementById("progressBarFill").style.width = progress + "%";
            document.getElementById("progressText").textContent = Math.round(progress) + "%";
            lastProgress = progress;
          }
        }

      }

      // --- Level Editor ---
      let editorMode = false;
      let editorLevel = [];
      let selectedObjectType = 'spike1';
      let selectedObjects = [];
      let copiedObjects = [];
      let selecting = false;
      let selectStart = null;
      let selectEnd = null;
      let history = [];
      let historyIndex = -1;

      function saveState() {
        history = history.slice(0, historyIndex + 1);
        history.push(JSON.parse(JSON.stringify(editorLevel)));
        historyIndex++;
        if (history.length > 50) {
          history.shift();
          historyIndex--;
        }
      }

      function toggleEditor() {
        editorMode = !editorMode;
        if (editorMode) {
          // Enter editor mode
          gameState.status = "editor";
          gameState.camera.x = 0;
          gameState.camera.y = 2 * CONSTANTS.PIXELS_PER_UNIT - 1080 * 0.77;
          editorLevel = JSON.parse(JSON.stringify(gameState.level)); // Deep copy
          history = [JSON.parse(JSON.stringify(editorLevel))];
          historyIndex = 0;
          staticContainer.removeChildren();
          staticContainer.addChild(groundSprite);
          levelSprites.clear();
          showEditorPalette();
          bgMusic.pause();
          console.log("Entered level editor. Use WASD to move camera, click to place objects.");
        } else {
          // Exit editor mode
          gameState.level = JSON.parse(JSON.stringify(editorLevel)); // Deep copy
          staticContainer.removeChildren();
          staticContainer.addChild(groundSprite);
          levelSprites.clear();
          gameState.status = "playing";
          bgMusic.currentTime = 0;
          bgMusic.play();
          hideEditorPalette();
          console.log("Exited level editor.");
        }
      }

      function exportLevel() {
        const levelData = "[\n" +
            editorLevel.map(obj => "  " + JSON.stringify(obj)).join(",\n") +
            "\n]";

        console.log("Level Data (copy this to the level array):");
        console.log(levelData);

        // Copy to clipboard
        navigator.clipboard.writeText(levelData).then(() => {
          console.log("Level data copied to clipboard!");
        });
      }

      function clearLevel() {
        saveState();
        editorLevel = [];
        console.log("Level cleared!");
      }

      function showEditorPalette() {
        const palette = document.getElementById('editor-palette');
        palette.innerHTML = '';
        // Add delete tool
        const deleteItem = document.createElement('div');
        deleteItem.className = 'palette-item delete';
        deleteItem.dataset.type = 'delete';
        deleteItem.title = 'Delete Object';
        deleteItem.onclick = () => {
            selectedObjectType = 'delete';
            document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('selected'));
            deleteItem.classList.add('selected');
        };
        const rotateItem = document.createElement('div');
        rotateItem.className = 'palette-item rotate';
        rotateItem.dataset.type = 'rotate';
        rotateItem.title = 'Rotate Object';
        deleteItem.onclick = () => {
            selectedObjectType = 'delete';
            document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('selected'));
            deleteItem.classList.add('selected');
        };
        const objectTypes = Object.keys(CONSTANTS.OBJECT_HITBOXES).filter(type => type !== 'color_trigger'); // Exclude invisible triggers
        objectTypes.forEach(type => {
            const item = document.createElement('div');
            item.className = 'palette-item';
            item.dataset.type = type;
            item.title = `Place ${type.replace(/_/g, ' ')}`;
            item.style.backgroundImage = `url(${ASSET_CONFIG[type]})`;
            if (type === selectedObjectType) {
                item.classList.add('selected');
            }
            item.onclick = () => {
                selectedObjectType = type;
                document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
            };
            palette.appendChild(item);
        });
        rotateItem.onclick = () => {
            selectedObjectType = 'rotate';
            document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('selected'));
            rotateItem.classList.add('selected');
        };
        palette.prepend(rotateItem);
        palette.prepend(deleteItem); // Add delete tool at the beginning
        palette.style.display = 'flex';
      }

      function hideEditorPalette() {
          const palette = document.getElementById('editor-palette');
          if (palette) {
              palette.style.display = 'none';
          }
      }

      function handleEditorClick(e) {
        if (!editorMode) return;

        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1);
        // Adjust for canvas scale, camera zoom and position
        const unscaledX = (e.clientX - rect.left) / scale;
        const unscaledY = (e.clientY - rect.top) / scale;
        const worldX = (unscaledX - canvas.width / 2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.x;
        const worldY = gameState.camera.y - (unscaledY - canvas.height / 2) / CONSTANTS.CAMERA_ZOOM;

        // Snap to visual grid lines
        const gridSize = 30 * CONSTANTS.CAMERA_ZOOM;
        let offsetX = (gameState.camera.x * CONSTANTS.CAMERA_ZOOM) % gridSize;
        if (offsetX < 0) offsetX += gridSize;
        const gridX = Math.round((unscaledX + offsetX) / gridSize) * gridSize - offsetX;
        const worldXGrid = (gridX - canvas.width / 2) / CONSTANTS.CAMERA_ZOOM + gameState.camera.x;
        const x = Math.round(worldXGrid / CONSTANTS.PIXELS_PER_UNIT);

        let offsetY = (gameState.camera.y * CONSTANTS.CAMERA_ZOOM) % gridSize;
        if (offsetY < 0) offsetY += gridSize;
        const gridY = Math.round((unscaledY + offsetY) / gridSize) * gridSize - offsetY;
        const worldYGrid = gameState.camera.y - (gridY - canvas.height / 2) / CONSTANTS.CAMERA_ZOOM;
        const y = Math.round(worldYGrid / CONSTANTS.PIXELS_PER_UNIT);

        const type = selectedObjectType;

        // Right click to delete
        if (e.button === 2) {
            saveState();
            editorLevel = editorLevel.filter(obj => !(obj.x === x && obj.y === y));
            console.log(`Removed object at (${x}, ${y})`);
            return;
        }
        if (type === 'delete') {
            saveState();
            editorLevel = editorLevel.filter(obj => !(obj.x === x && obj.y === y));
            return;
        }
        if (type === 'rotate') {
            const objectToRotate = editorLevel.find(obj => obj.x === x && obj.y === y);
            if (objectToRotate) {
                saveState();
                objectToRotate.rotation = ((objectToRotate.rotation || 0) + 90) % 360;
                console.log(`Rotated object at (${x}, ${y}) to ${objectToRotate.rotation} degrees`);
            }
            return;
        }
        if (e.shiftKey) {
            // Toggle selection
            const obj = editorLevel.find(obj => Math.abs(obj.x - x) < 0.5 && Math.abs(obj.y - y) < 0.5);
            if (obj) {
                if (selectedObjects.includes(obj)) {
                    selectedObjects = selectedObjects.filter(o => o !== obj);
                } else {
                    selectedObjects.push(obj);
                }
            }
            return;
        }
        // Clear selection if not shift
        selectedObjects = [];
        saveState();
        editorLevel.push({ type, x, y });
        console.log(`Placed ${type} at (${x}, ${y})`);
      }

      // --- Initializer ---
      function init() {
        resizeCanvas();
        resetGameState();

        // UI Button Listeners
        const challengeBtn = document.getElementById("challengeBtn");
        const stereoBtn = document.getElementById("stereoBtn");
        const retryBtn = document.getElementById("retryBtn");
        const playAgainBtn = document.getElementById("playAgainBtn");
        const deathScreen = document.getElementById("deathScreen");
        const winScreen = document.getElementById("winScreen");
        const attemptCounter = document.getElementById("attemptCounter");

        challengeBtn.addEventListener("click", () => {
          if (!window.challengeLevel) {
            const script = document.createElement('script');
            script.src = '/scripts/levels/challenge.js';
            script.onload = () => {
              currentLevel = window.challengeLevel;
              startGame();
            };
            document.head.appendChild(script);
          } else {
            currentLevel = window.challengeLevel;
            startGame();
          }
        });

        stereoBtn.addEventListener("click", () => {
          if (!window.stereoMadnessLevel) {
            const script = document.createElement('script');
            script.src = '/scripts/levels/stereomadness.js';
            script.onload = () => {
              currentLevel = window.stereoMadnessLevel;
              startGame();
            };
            document.head.appendChild(script);
          } else {
            currentLevel = window.stereoMadnessLevel;
            startGame();
          }
        });

        function startGame() {
          resetGameState();
          startMenu.style.display = "none";
          gameState.status = "playing";
          bgMusic.src = currentLevel.music;
          bgMusic.load();
          bgMusic.currentTime = 0;
          bgMusic.play();
        }

        retryBtn.addEventListener("click", () => {
          deathScreen.style.display = "none";
          resetGameState();
          gameState.status = "playing";
          bgMusic.currentTime = 0;
          bgMusic.play();
        });

        playAgainBtn.addEventListener("click", () => {
          winScreen.style.display = "none";
          resetGameState();
          gameState.status = "playing";
          bgMusic.currentTime = 0;
          bgMusic.play();
        });

        window.addEventListener("resize", resizeCanvas);
        // Use keydown/up for continuous hold detection
        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("keyup", handleKeyUp);
        // Mouse events
        canvas.addEventListener("mousedown", handleMouseDown);
        canvas.addEventListener("mouseup", handleInputUp);
        // Touch events
        canvas.addEventListener('contextmenu', e => {
            if (editorMode) {
                e.preventDefault();
            }
        });
        canvas.addEventListener("touchstart", handleInputDown);
        canvas.addEventListener("touchend", handleInputUp);
        canvas.addEventListener("mousemove", handleMouseMove);
        canvas.addEventListener("mouseup", handleMouseUp);

        // Handle tab visibility to pause/play music
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            bgMusic.pause();
          } else if (gameState.status === "playing" && !editorMode) {
            bgMusic.play();
          }
        });
        // Level editor shortcuts
        window.addEventListener("keydown", (e) => {
          // Handle toggling the editor regardless of the current mode
          if (e.key === "]" && !e.repeat) {
            e.preventDefault();
            toggleEditor();
          }

          if (!editorMode) return; // Only handle these keys in editor mode
          if (e.key === "e" || e.key === "E") {
            exportLevel();
          } else if (e.key === "c" || e.key === "C") {
            if (e.ctrlKey || e.metaKey) {
              copiedObjects = selectedObjects.map(obj => ({...obj}));
            } else {
              clearLevel();
            }
          } else if (e.key === "v" || e.key === "V") {
            if (e.ctrlKey || e.metaKey) {
              saveState();
              copiedObjects.forEach(obj => {
                editorLevel.push({...obj, x: obj.x + 1});
              });
            }
          } else if (e.key === "z" || e.key === "Z") {
            if (e.ctrlKey || e.metaKey) {
              if (historyIndex > 0) {
                historyIndex--;
                editorLevel = JSON.parse(JSON.stringify(history[historyIndex]));
              }
            }
          } else if (e.key === "y" || e.key === "Y") {
            if (e.ctrlKey || e.metaKey) {
              if (historyIndex < history.length - 1) {
                historyIndex++;
                editorLevel = JSON.parse(JSON.stringify(history[historyIndex]));
              }
            }
          } else if (e.key === "Delete") {
            saveState();
            selectedObjects.forEach(obj => {
              editorLevel = editorLevel.filter(o => o !== obj);
            });
            selectedObjects = [];
          }
        });

        console.log("Loading assets...");
        loadAssets(() => {
          console.log("Assets loaded. Starting game.");
          console.log(
            "Controls: Click/Space to jump, H to toggle hitbox visualization"
          );
          console.log(
            "Level Editor: Tab to toggle, E to export, C to clear, Click to place"
          );
          lastTime = performance.now();
          requestAnimationFrame(gameLoop);
        });
      }

      init();
    </script>
  </body>
