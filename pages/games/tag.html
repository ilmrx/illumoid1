<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Tag</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
            rel="stylesheet"
        />
        <style>
            /* REPLACE your existing <style> contents with this or merge rules */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Orbitron", monospace;
            }
            .btn {
                padding: 10px 18px;
                border-radius: 8px;
                background: linear-gradient(180deg, #00eefd, #00a8c0);
                color: #001217;
                font-weight: 700;
                border: none;
                cursor: pointer;
                box-shadow: 0 10px 30px rgba(0, 168, 192, 0.08);
            }
            #mainMenu {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 400;
            }
            .mm-backdrop {
                position: absolute;
                inset: 0;
                background: transparent;
                backdrop-filter: none;
                pointer-events: none;
            }
            .mm-card {
                position: relative;
                min-width: 420px;
                max-width: 86vw;
                padding: 24px;
                border-radius: 14px;
                background: linear-gradient(180deg, #071827, #041017);
                border: 1px solid rgba(0, 238, 255, 0.1);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
                color: #eaf9ff;
                z-index: 1;
                text-align: center;
            }
            .char-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin: 12px 0 16px;
                align-items: end;
            }
            .group-title {
                text-align: left;
                font-weight: 700;
                margin-bottom: 6px;
                color: #bfefff;
            }
            .char-row { 
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .char-btn {
                padding: 8px 10px;
                border-radius: 8px;
                border: 1px solid rgba(0, 238, 255, 0.18); 
                background: linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.12),
                    rgba(255, 255, 255, 0.02)
                );
                color: #eaf9ff;
                cursor: pointer;
                box-shadow: 0 6px 18px rgba(0, 168, 192, 0.06);
            }
            .char-btn.selected {
                border-color: #00eefd;
                box-shadow:
                    0 0 0 1px rgba(0, 238, 255, 0.2),
                    0 10px 30px rgba(0, 168, 192, 0.1);
            }
            .mm-field {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: space-between;
                margin: 8px 0;
                position: relative; /* Ensure this field is not overlapped */
                z-index: 1; /* Ensure it stacks correctly against the custom dropdown */
            }
            .mm-field label {
                font-size: 13px;
                margin-bottom: 6px;
                color: #bfefff;
            }
            select.mm-select {
                background: rgba(0, 0, 0, 0.3);
                color: #eaf9ff;
                border: 1px solid rgba(0, 238, 255, 0.2);
                padding: 8px 10px;
                border-radius: 8px;
                font-weight: 700;
                outline: none;
                min-width: 120px;
                transition: box-shadow 120ms ease;
            }
            select.mm-select:focus {
                box-shadow: 0 0 0 2px rgba(0, 238, 255, 0.35) inset;
            }
            select.mm-select:hover {
                border-color: rgba(0, 238, 255, 0.35);
            }
            .menu-actions {
                display: flex;
                gap: 10px;
                justify-content: center;
            }
            #settingsPanel {
                position: absolute;
                inset: 0;
                margin: auto;
                transform: none;
                height: fit-content;
                min-width: 420px;
                max-width: 86vw;
                padding: 18px;
                border-radius: 12px;
                background: linear-gradient(180deg, #071827, #021118);
                border: 1px solid rgba(0, 238, 255, 0.12);
                box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6);
                display: none;
                z-index: 2;
            }
            #settingsPanel .row {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-bottom: 12px;
            }
            #settingsPanel input {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                background: #0b1a24;
                color: #eaf9ff;
                border: 1px solid rgba(0, 238, 255, 0.12);
            }
            #settingsPanel .label {
                font-weight: 700;
                margin-bottom: 6px;
                color: #bfefff;
            }
            #settingsPanel .actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            .mm-title {
                font-size: 28px;
                font-weight: 900;
                margin-bottom: 12px;
                color: #fff;
            }
            /* Custom Range Slider Styles from fighting.html */
            input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                width: 120px;
                height: 8px;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 5px;
                outline: none;
                border: 1px solid rgba(0, 238, 255, 0.1);
            }
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 18px;
                height: 18px;
                background: #00eefd;
                cursor: pointer;
                border-radius: 50%;
                border: 2px solid #071827;
                box-shadow: 0 0 8px rgba(0, 238, 255, 0.5);
            }
            input[type="range"]::-moz-range-thumb {
                width: 16px;
                height: 16px;
                background: #00eefd;
                cursor: pointer;
                border-radius: 50%;
                border: 2px solid #071827;
            }
            input[type="range"]::-ms-thumb {
                width: 18px;
                height: 18px;
                background: #00eefd;
                cursor: pointer;
                border-radius: 50%;
                border: 2px solid #071827;
            }
            input[type="range"]:focus {
                box-shadow: 0 0 0 2px rgba(0, 238, 255, 0.35) inset;
            }
            input[type="range"]:hover {
                border-color: rgba(0, 238, 255, 0.35);
            }
            /* Custom Dropdown Styles from fighting.html */
            .visuallyHidden {
                position: absolute !important;
                left: -9999px !important;
                width: 1px;
                height: 1px;
                overflow: hidden;
            }
            .dd {
                position: relative;
                display: inline-block;
            }
            .dd-btn {
                padding: 8px 34px 8px 12px;
                border-radius: 8px;
                border: 1px solid rgba(0, 238, 255, 0.2);
                background: rgba(0, 0, 0, 0.3);
                color: #eaf9ff;
                cursor: pointer;
                font-weight: 700;
                min-width: 140px;
                text-align: left;
                position: relative;
            }
            .dd-btn:after {
                content: "";
                position: absolute;
                right: 10px;
                top: 50%;
                width: 0;
                height: 0;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-top: 6px solid rgba(191, 239, 255, 0.9);
                transform: translateY(-25%);
            }
            .dd-btn:focus {
                outline: none;
                box-shadow: 0 0 0 2px rgba(0, 238, 255, 0.35) inset;
            }
            .dd-menu {
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                min-width: 100%;
                background: linear-gradient(180deg, #071827, #041017);
                border: 1px solid rgba(0, 238, 255, 0.14);
                box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
                border-radius: 10px;
                opacity: 0;
                transform: translateY(-6px);
                pointer-events: none;
                transition: opacity 140ms ease, transform 140ms ease;
                z-index: 5;
                overflow: hidden;
            }
            .dd.open .dd-menu {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }
            .dd-item {
                padding: 10px 12px;
                color: #bfefff;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }
            .dd-item:last-child {
                border-bottom: none;
            }
            .dd-item:hover,
            .dd-item[aria-selected="true"] {
                background: rgba(255, 255, 255, 0.06);
                color: #eaf9ff;
            }
            html,
            body {
                height: 100%;
            }
            body {
                background: linear-gradient(135deg, #0c0c0c, #16213e);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                background: radial-gradient(circle, #0d1117 0%, #000 100%);
                box-shadow:
                    0 6px 30px rgba(0, 0, 0, 0.6),
                    0 0 60px rgba(0, 238, 255, 0.06);
            }
            #cinemaTop,
            #cinemaBottom {
                position: fixed;
                left: 0;
                right: 0;
                height: 0;
                background: rgba(0, 0, 0, 0.96);
                pointer-events: none;
                z-index: 100;
                transition: height 420ms;
            }
            #cinemaTop {
                top: 0;
            }
            #cinemaBottom {
                bottom: 0;
            }
            /* HUD */
            .hud {
                position: fixed;
                left: 18px;
                top: 18px;
                z-index: 220;
                display: flex;
                gap: 12px;
                align-items: center;
                pointer-events: none;
            }
            .hud .timer {
                min-width: 160px;
                padding: 10px 12px;
                border-radius: 10px;
                background: linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.12),
                    rgba(255, 255, 255, 0.02)
                );
                border: 1px solid rgba(0, 238, 255, 0.06);
                color: #bfefff;
                text-shadow: 0 0 6px rgba(0, 238, 255, 0.06);
            }
            .timer .big {
                font-size: 36px;
                font-weight: 900;
                color: #fff;
            }
            /* modal */
            #gameOverModal {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 300;
                pointer-events: none;
                opacity: 0;
                transition: opacity 220ms ease;
            }
            #gameOverModal.show {
                pointer-events: auto;
                opacity: 1;
            }
            .modal-content {
                position: relative;
                min-width: 420px;
                max-width: 86vw;
                padding: 28px;
                border-radius: 12px;
                background: linear-gradient(180deg, #071827, #021118);
                border: 1px solid rgba(0, 238, 255, 0.08);
                box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
                color: #eaf9ff;
                text-align: center;
                transform: translateY(0);
            }
            .modal-content h1 {
                font-size: 32px;
                font-weight: 900;
                margin-bottom: 8px;
                color: #fff;
                text-shadow: 0 6px 30px rgba(0, 238, 255, 0.04);
                font-size: 20px;
                margin-bottom: 18px;
            }
            .button {
                padding: 10px 18px;
                border-radius: 8px;
                background: linear-gradient(180deg, #00eefd, #00a8c0);
                color: #001217;
                font-weight: 700;
                border: none;
                cursor: pointer;
                box-shadow: 0 10px 30px rgba(0, 168, 192, 0.08);
            }
        </style>
    </head>
    <body>
        <div id="mainMenu" aria-hidden="false">
            <div class="mm-backdrop"></div>
            <div class="mm-card">
                <div class="mm-title">Tag</div>
                <div class="char-grid">
                    <div>
                        <div class="group-title">P1 (Red)</div>
                        <div class="mm-field">
                            <label for="p1Type">Control</label>
                            <select id="p1Type" class="mm-select">
                                <option value="human" selected>Human</option>
                                <option value="ai">Bot</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="group-title">P2 (Blue)</div>
                        <div class="mm-field">
                            <label for="p2Type">Control</label>
                            <select id="p2Type" class="mm-select">
                                <option value="human" selected>Human</option>
                                <option value="ai">Bot</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="menu-actions">
                    <button id="btnSettings" class="btn" type="button">
                        Settings
                    </button>
                    <button id="btnStart" class="btn">Start Game</button>
                </div>
                <div id="settingsPanel" role="dialog" aria-hidden="true">
                    <div class="row">
                        <div>
                            <div class="label">Time (sec)</div>
                            <input
                                id="setTime"
                                type="number"
                                min="1"
                                max="600"
                                value="60"
                            />
                        </div>
                        <div>
                            <div class="label">Gravity</div>
                            <input
                                id="setGrav"
                                type="number"
                                step="0.1"
                                min="1"
                                max="3"
                                value="1"
                            />
                        </div>
                        <div>
                            <div class="label">PWups (sec)</div>
                            <input
                                id="setFreq"
                                type="number"
                                min="0"
                                max="60"
                                step="0.01"
                                value="5"
                            />
                        </div>
                    </div>
                    <div class="row">
                        <div>
                            <div class="label">Speed Multiplier</div>
                            <input
                                id="setSpeed"
                                type="number"
                                step="0.1"
                                min="0.5"
                                max="100"
                                value="1"
                            />
                        </div>
                    </div>
                    <div class="row">
                        <div>
                            <div class="label">Max Powerups</div>
                            <input
                                id="setMaxPowerups"
                                type="number"
                                min="0"
                                max="100"
                                value="3"
                            />
                        </div>
                        <div>
                            <div class="label">Jump Multiplier</div>
                            <input
                                id="setJump"
                                type="number"
                                step="0.1"
                                min="0.5"
                                max="100"
                                value="1"
                            />
                        </div>
                        <div>
                            <div class="label">Orbital Chance (%)</div>
                            <input
                                id="setOrbitalChance"
                                type="number"
                                min="0"
                                max="100"
                                value="1"
                            />
                        </div>
                    </div>
                    <div class="row">
                        <div style="grid-column: 1 / -1">
                            <div class="label">Allowed Powerups</div>
                            <div id="powerupSelection" style="display: flex; gap: 15px; margin-top: 5px; color: #bfefff;">
                                <label style="display: flex; align-items: center; gap: 5px;">
                                    <input type="checkbox" id="pu_swap" value="swap" checked> Swap</label>
                                <label style="display: flex; align-items: center; gap: 5px;">
                                    <input type="checkbox" id="pu_speed" value="speed" checked> Speed</label>
                                <label style="display: flex; align-items: center; gap: 5px;">
                                    <input type="checkbox" id="pu_freeze" value="freeze" checked> Freeze</label>
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <button id="btnCloseSettings" class="btn" type="button">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas" tabindex="0"></canvas>
        <div id="cinemaTop"></div>
        <div id="cinemaBottom"></div>
        <div id="gameOverModal">
            <div class="modal-content">
                <h1 id="winnerMessage"></h1>
                <button id="retryButton" class="btn" type="button">
                    Retry
                </button>
            </div>
        </div>
        <div
            id="easterEgg"
            style="
                display: none;
                position: fixed;
                inset: 0;
                z-index: 9999;
            "
        >
            <img src="../../image/dispatch/ayo sus.png" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <script>
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            const BASE_WIDTH = 1600,
                BASE_HEIGHT = 900;
            let scaleFactor = 1;
            function handleResize() {
                const widthScale = window.innerWidth / BASE_WIDTH;
                const heightScale = window.innerHeight / BASE_HEIGHT;
                scaleFactor = Math.min(widthScale, heightScale);
                canvas.width = Math.round(BASE_WIDTH * scaleFactor);
                canvas.height = Math.round(BASE_HEIGHT * scaleFactor);
            }
            handleResize();
            window.addEventListener("resize", handleResize);
            let performanceMode = document.documentElement.classList.contains('performance-mode');
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                        performanceMode = document.documentElement.classList.contains('performance-mode');
                    }
                });
            });
            observer.observe(document.documentElement, { attributes: true });
            const GRAVITY = 0.4;
            const JUMP_POWER = -20;
            const MOVE_SPEED = 10;
            const PLAYER_SIZE = 35;
            const FRAME_RATE = 60;
            const FRAME_TIME = 1000 / FRAME_RATE;
            let lastTime = 0;
            let accumulator = 0;
            let gameTimeSeconds = 60;
            let gameTimeInterval = null;
            let powerUpSpawnTimer = 0;
            const gameSettings = {
                time: 60,
                gravity: 1,
                secondsPerPU: 5,
                speedMult: 1,
                jumpMult: 1,
                maxPowerups: 3,
                orbitalChance: 1,
                allowedPowerups: ["swap", "speed", "freeze"],
            };
            let isGameRunning = false;
            let countdown = 3,
                showGo = false,
                goStartTime = 0;
            let tagCooldown = false,
                cooldownTimer = 0;
            const COOLDOWN_DURATION = 1;
            let timeScale = 1;
            let screenShake = 0;
            const AI_ENABLED = { p1: false, p2: false };
            const AI_DIFFICULTY = { p1: 3, p2: 3 };
            const NEON_CYAN = "#00eeff";
            // player colors changed to match the fighting game's neon card palette
            const PLAYER_1_COLOR = "rgba(255,85,120,1)"; // red/pink
            const PLAYER_2_COLOR = "rgba(0,170,255,1)"; // cyan/blue
            const powerUps = [];
            const POWERUP_SIZE = 40,
                POWERUP_RADIUS = 20;
            let swapFlash = {
                active: false,
                start: 0,
                duration: 500,
                type: "swap",
                color: "#ff00ff",
            };
            let orbitalStrike = {
                active: false,
                start: 0,
                duration: 2400,
                targetIndex: null,
                beamY: -300,
                color: "#ff4444",
                _bursted: false,
                attackerIndex: null,
            };
            const platforms = [
                { x: 0, y: 0, w: BASE_WIDTH, h: 20 },
                { x: 0, y: 880, w: BASE_WIDTH, h: 20 },
                { x: 0, y: 0, w: 20, h: BASE_HEIGHT },
                { x: BASE_WIDTH - 20, y: 0, w: 20, h: BASE_HEIGHT },
                { x: 650, y: 500, w: 300, h: 20 },
                { x: 650, y: 700, w: 300, h: 20 },
                { x: 200, y: 500, w: 200, h: 20 },
                { x: 1200, y: 500, w: 200, h: 20 },
                { x: 200, y: 300, w: 200, h: 20 },
                { x: 1200, y: 300, w: 200, h: 20 },
            ];
            const slopes = [
                {
                    x: 180,
                    y: 700,
                    w: 300,
                    h: 20,
                    angle: 20,
                    slope: Math.tan((20 * Math.PI) / 180),
                },
                {
                    x: 1120,
                    y: 700,
                    w: 300,
                    h: 20,
                    angle: -20,
                    slope: Math.tan((-20 * Math.PI) / 180),
                },
            ];
            function getPowerUpColor(type) {
                const colors = {
                    swap: "#ff00ff",
                    speed: "#4caf50",
                    freeze: "#2196f3",
                    frozen: "#2196f3",
                    orbital: "#ff4444",
                };
                return colors[type] || "#fff";
            }
            // keep existing rounded draw helper (used elsewhere)
            function drawRoundedRect(x, y, w, h, r, color) {
                ctx.save();
                if (!performanceMode) {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 15;
                }
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.fill();
                ctx.restore();
            }
            // helper to draw a stroked rounded rect (used by platform styling)
            function drawRoundedRectStroke(
                x,
                y,
                w,
                h,
                r,
                strokeStyle,
                lineWidth = 2,
            ) {
                ctx.save();
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
            class Player {
                constructor(x, y, color, controls, name, isTagger) {
                    this.x = x;
                    this.y = y;
                    this.vx = 0;
                    this.vy = 0;
                    this.w = PLAYER_SIZE;
                    this.h = PLAYER_SIZE;
                    this.color = color;
                    this.controls = controls;
                    this.name = name;
                    this.isTagger = isTagger;
                    this.onGround = false;
                    this.onWall = false;
                    this.wallJumping = false;
                    this.wallSlide = false;
                    this.facingRight = true;
                    this.wallJumpCooldown = 0;
                    this.effects = [];
                    this.slopeAngle = 0;
                    this.slopeCenterX = 0;
                    this.lastGroundedTime = 0;
                    this.visible = true;
                    this.moveMult = 1;
                    this.jumpMult = 1;
                    this.gravMult = 1;
                    this.inputs = {
                        left: false,
                        right: false,
                        up: false,
                        down: false,
                            usePowerUp: false,
                    };
                    this.stuckTimer = 0;
                    this.lastPosition = { x: x, y: y };
                    this.jumpCount = 0;
                    this.powerUpInventory = null; // Can hold one power-up
                }
                squishX = 1;
                squishY = 1;
                isUnderPlatform() {
                    for (const plat of platforms) {
                        if (
                            this.x + this.w > plat.x &&
                            this.x < plat.x + plat.w &&
                            this.y < plat.y &&
                            this.y + this.h > plat.y
                        ) {
                            return true;
                        }
                    }
                    return false;
                }

                        "Select";
                    function close() { wrap.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
                    function open() { wrap.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
                    btn.addEventListener("click", () => { wrap.classList.contains("open") ? close() : open(); });
                    menu.addEventListener("click", (e) => {
                        const item = e.target.closest(".dd-item");
                        if (!item) return;
                        sel.value = item.dataset.value;
                        btn.textContent = item.querySelector(".dd-label").textContent;
                        items.forEach((it) => it.setAttribute("aria-selected", it === item ? "true" : "false"));
                        close();
                    });
                    document.addEventListener("click", (e) => { if (!wrap.contains(e.target)) close(); });
                    sel.insertAdjacentElement("afterend", wrap);
                    wrap.appendChild(btn);
                    wrap.appendChild(menu);
                }
                window.buildDropdownForSelect = buildDropdownForSelect;
            })();
            window.onload = () => {
                handleResize();
                window.addEventListener("resize", handleResize);
                document
                    .getElementById("retryButton")
                    .addEventListener("click", resetGame);
                const btn = document.getElementById("btnStart");
                if (btn) btn.addEventListener("click", startFromMenu);
                initSettingsPanel();
                buildDropdownForSelect(document.getElementById("p1Type"));
                buildDropdownForSelect(document.getElementById("p2Type"));
                if (!window._loopStarted) {
                    window._loopStarted = true;
                    requestAnimationFrame(animate);
                }
            };
        </script>
    </body>
</html>
