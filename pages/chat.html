<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://iframe.chat/scripts/main.min.js"></script>
  <script>
    chattable.initialize({
      stylesheet: "/styles/chattable.css",
    });
  </script>
  <title>Chat</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #chattable {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://iframe.chat/embed?chat=illumoid"
    id="chattable"
    frameborder="none"
  ></iframe>
</body>
</html>
